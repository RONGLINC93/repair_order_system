<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>工单管理 - 网盘</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1">
    <link rel="stylesheet" href="/css/mobile-style.css">
    <link rel="stylesheet" href="/fontawesome-free-6.6.0-web/css/all.min.css">
</head>
<body  style="overflow: hidden;">
    <!-- 顶部导航栏 -->
    <header class="mobile-header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
                <span class="unread-badge" id="menuChatBadge" style="display: none;"></span>
            </button>
            <h1 class="app-title">网盘</h1>
        </div>
        <div class="header-right">
            <div class="notification-icon" onclick="window.location.href='/mobile-notifications.html'">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" id="mobileNotificationBadge">0</span>
            </div>
        </div>
    </header>

      <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="user-info">
                <div class="user-avatar" id="sidebarAvatar" onclick="window.location.href='/mobile-profile.html'">
                    <i class="fas fa-user" id="sidebarAvatarIcon"></i>
                    <img id="sidebarAvatarImage" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" alt="用户头像">
                </div>
                <div class="user-details">
                    <div class="user-name" id="mobileUserName">用户</div>
                    <div class="user-role" id="mobileUserRole">角色</div>
                </div>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="/mobile-index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </a>
            <a href="/mobile-my-orders.html" class="nav-item" id="myOrdersLink">
                <i class="fas fa-tasks"></i>
                <span>我的工单</span>
            </a>
            <a href="/mobile-orders.html" class="nav-item">
                <i class="fas fa-list"></i>
                <span>所有工单</span>
            </a>
            <a href="/mobile-material-requests.html" class="nav-item" id="materialRequestsLink">
                <i class="fas fa-box"></i>
                <span>物料管理</span>
            </a>
            <a href="/mobile-chat.html" class="nav-item" id="chatLink">
                <i class="fas fa-comment"></i>
                <span>内部聊天</span>
                <span class="unread-badge" id="unreadChatCount" style="display: none;"></span>
            </a>            
            <a href="/mobile-admin.html" class="nav-item" id="adminLink" style="display: none;">
                <i class="fas fa-cogs"></i>
                <span>系统管理</span>
            </a>
                        
            <a href="/mobile-app-center.html" class="nav-item">
                <i class="fas fa-th"></i>
                <span>应用中心</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            
            <a href="/mobile-settings.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>设置</span>
            </a>
<a href="/mobile-about.html" class="nav-item" id="aboutLink">
                <i class="fas fa-info-circle"></i>
                <span>关于系统</span>
            </a>
            <a href="#" class="nav-item logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>退出登录</span>
            </a>
        </div>
    </aside>
    
    <!-- 侧边栏遮罩层 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 文件列表区域 -->
        <section class="files-section">
            <div class="section-header" style="padding-top: 10px;">
                <div class="header-actions">
                    <button class="upload-btn" onclick="openUploadModal()">
                        <i class="fas fa-upload"></i>
                    </button>
                    <button class="folder-btn" onclick="openCreateFolderModal()">
                        <i class="fas fa-folder-plus"></i>
                    </button>
                </div>
            </div>
            <!-- 目录导航栏 -->
            <div class="directory-nav">
                <div class="back-btn" id="backBtn" style="display: none;" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i>
                    <span>返回</span>
                </div>
                <div class="current-path-wrapper">
                    <div class="current-path" id="currentPath" onclick="togglePathDropdown()">主目录</div>
                    <div class="path-dropdown" id="pathDropdown" style="display: none;">
                        <!-- 路径下拉列表将在这里动态生成 -->
                    </div>
                </div>
                <div class="refresh-btn" onclick="loadFiles()" title="刷新列表">
                    <i class="fas fa-sync-alt"></i>
                </div>
            </div>
            <div class="files-list" id="filesList">
                <!-- 加载动画 -->
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>加载中...</span>
                </div>
            </div>
        </section>
    </main>

    <!-- 上传文件模态框 -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h4>上传文件</h4>
                <button class="close-btn" onclick="closeUploadModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="uploadForm" enctype="multipart/form-data">
                    <input type="hidden" name="storageType" id="modalStorageType">
                    <div class="form-group">
                        <label>选择文件</label>
                        <div class="file-select-area" onclick="document.getElementById('fileInput').click()" 
                             ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p id="fileSelectedText">点击选择文件或拖拽文件到此处</p>
                            <p class="file-select-hint">支持所有文件类型</p>
                        </div>
                        <input type="file" id="fileInput" name="file" accept="*/*" required style="display: none;">
                    </div>
                    <div class="form-group" id="uploadButtonGroup" style="display: none;">
                        <button type="submit" class="submit-btn">
                            <i class="fas fa-upload"></i>
                            开始上传
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 新建文件夹模态框 -->
    <div class="modal" id="createFolderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h4>新建文件夹</h4>
                <button class="close-btn" onclick="closeCreateFolderModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="createFolderForm">
                    <input type="hidden" name="storageType" id="folderModalStorageType">
                    <div class="form-group">
                        <label for="folderName">文件夹名称</label>
                        <input type="text" class="form-control" id="folderName" name="folderName" placeholder="请输入文件夹名称" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="submit-btn">
                            <i class="fas fa-folder-plus"></i>
                            创建文件夹
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 通用提示模态框 -->
    <div class="modal" id="alertModal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h4 id="alertModalTitle">提示</h4>
                <button class="close-btn" onclick="closeAlertDialog()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; padding: 0px;">
                    <i id="alertModalIcon" class="fas fa-info-circle" style="font-size: 48px; color: #667eea; margin-bottom: 16px; display: block;"></i>
                    <p id="alertModalMessage" style="font-size: 16px; color: #333; line-height: 1.5; margin: 0;"></p>
                </div>
                <div class="form-group">
                    <button type="button" class="submit-btn" onclick="closeAlertDialog()">
                        <i class="fas fa-check"></i>
                        确定
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 通用确认模态框 -->
    <div class="modal" id="confirmModal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h4 id="confirmModalTitle">确认操作</h4>
                <button class="close-btn" onclick="closeConfirmDialog(false)">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; padding: 20px 0;">
                    <i id="confirmModalIcon" class="fas fa-question-circle" style="font-size: 48px; color: #ffc107; margin-bottom: 16px; display: block;"></i>
                    <p id="confirmModalMessage" style="font-size: 16px; color: #333; line-height: 1.5; margin: 0;"></p>
                </div>
                <div class="form-group" style="display: flex; gap: 12px;">
                    <button type="button" class="submit-btn" style="flex: 1; background: #6c757d;" onclick="closeConfirmDialog(false)">
                        <i class="fas fa-times"></i>
                        取消
                    </button>
                    <button type="button" class="submit-btn" style="flex: 1;" onclick="closeConfirmDialog(true)">
                        <i class="fas fa-check"></i>
                        确定
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 移动文件模态框 -->
    <div class="modal" id="moveModal" style="z-index: 100;">
        <div class="modal-content">
            <div class="modal-header">
                <h4>移动文件</h4>
                <button class="close-btn" onclick="closeMoveModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <!-- 提示信息 -->
                <div class="modal-tip" style="background: #e3f2fd; border-left: 4px solid #2196f3; padding: 12px; margin-bottom: 16px; border-radius: 4px;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <i class="fas fa-info-circle" style="color: #2196f3; font-size: 16px;"></i>
                        <div>
                            <p style="margin: 0; color: #1976d2; font-size: 14px; font-weight: 500;">移动文件提示</p>
                            <p style="margin: 4px 0 0 0; color: #666; font-size: 13px;">如果目标位置已存在同名文件，系统会提示您选择覆盖、创建副本或取消操作</p>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>选择目标文件夹</label>
                    <div class="folder-selector" id="folderSelector" style="max-height: 300px; overflow-y: auto;">
                        <!-- 文件夹列表将在这里动态生成 -->
                    </div>
                </div>
                <div class="form-group" style="display: flex; gap: 12px;">
                    <button type="button" class="submit-btn" style="flex: 1; background: #6c757d;" onclick="closeMoveModal()">
                        <i class="fas fa-times"></i>
                        取消
                    </button>
                    <button type="button" class="submit-btn" style="flex: 1;" onclick="confirmMove()">
                        <i class="fas fa-check"></i>
                        移动
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 复制文件模态框 -->
    <div class="modal" id="copyModal" style="z-index: 100;">
        <div class="modal-content">
            <div class="modal-header">
                <h4>复制文件</h4>
                <button class="close-btn" onclick="closeCopyModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <!-- 提示信息 -->
                <div class="modal-tip" style="background: #e8f5e8; border-left: 4px solid #4caf50; padding: 12px; margin-bottom: 16px; border-radius: 4px;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <i class="fas fa-info-circle" style="color: #4caf50; font-size: 16px;"></i>
                        <div>
                            <p style="margin: 0; color: #388e3c; font-size: 14px; font-weight: 500;">复制文件提示</p>
                            <p style="margin: 4px 0 0 0; color: #666; font-size: 13px;">如果目标位置已存在同名文件，系统会提示您选择覆盖、创建副本或取消操作</p>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>选择目标文件夹</label>
                    <div class="folder-selector" id="copyFolderSelector" style="max-height: 300px; overflow-y: auto;">
                        <!-- 文件夹列表将在这里动态生成 -->
                    </div>
                </div>
                <div class="form-group" style="display: flex; gap: 12px;">
                    <button type="button" class="submit-btn" style="flex: 1; background: #6c757d;" onclick="closeCopyModal()">
                        <i class="fas fa-times"></i>
                        取消
                    </button>
                    <button type="button" class="submit-btn" style="flex: 1;" onclick="confirmCopy()">
                        <i class="fas fa-check"></i>
                        复制
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 文件预览模态框 -->
    <div class="modal" id="previewModal">
        <div class="modal-content preview-modal-content">
            <div class="modal-header">
                <h4 id="previewModalTitle">文件预览</h4>
                <button class="close-btn" onclick="closePreviewModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body preview-modal-body">
                <div id="previewContent" class="preview-content">
                    <!-- 预览内容将在这里动态生成 -->
                </div>
                <div class="preview-actions">
                    <button class="preview-action-btn download" onclick="downloadPreviewFile()">
                        <i class="fas fa-download"></i>
                        <span>下载</span>
                    </button>
                    <button class="preview-action-btn share" onclick="shareFile()">
                        <i class="fas fa-share-alt"></i>
                        <span>分享</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 文件冲突对话框 -->
    <div class="modal" id="fileConflictModal">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h4 id="fileConflictModalTitle">文件冲突</h4>
                <button class="close-btn" onclick="closeFileConflictDialog()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div style="text-align: center; padding: 20px 0;">
                    <i id="fileConflictModalIcon" class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ffc107; margin-bottom: 16px; display: block;"></i>
                    <p id="fileConflictModalMessage" style="font-size: 16px; color: #333; line-height: 1.5; margin: 0;"></p>
                </div>
                <div class="form-group" style="display: flex; flex-direction: column; gap: 10px;">
                    <button type="button" class="submit-btn conflict-overwrite" onclick="handleFileConflictAction('overwrite')">
                        <i class="fas fa-sync-alt"></i>
                        覆盖现有文件
                    </button>
                    <button type="button" class="submit-btn conflict-copy" onclick="handleFileConflictAction('copy')">
                        <i class="fas fa-copy"></i>
                        创建副本
                    </button>
                    <button type="button" class="submit-btn conflict-cancel" style="background: #6c757d;" onclick="handleFileConflictAction('cancel')">
                        <i class="fas fa-times"></i>
                        取消操作
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script>
        let currentStorageType = 'private';
        let currentDirectory = '';
        let confirmCallback = null;
        let currentPreviewFile = null;
        let scrollPositions = new Map(); // 存储不同目录的滚动位置

        // 页面初始化
        document.addEventListener('DOMContentLoaded', async function() {
            await checkAuth();
            setupNavigation();
            
            // 初始化路径显示
            updateCurrentPath();
            
            await loadFiles();
            
            // 点击遮罩层关闭侧边栏
            document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
            
            // 上传表单提交事件
            document.getElementById('uploadForm').addEventListener('submit', handleFileUpload);
            
            // 文件选择监听事件
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            
            // 创建文件夹表单提交事件
            document.getElementById('createFolderForm').addEventListener('submit', handleCreateFolder);
        });

        // 检查权限
        async function checkAuth() {
            const user = Utils.getUser();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }

            // 更新用户信息
            document.getElementById('mobileUserName').textContent = user.fullName || user.username;
            document.getElementById('mobileUserRole').textContent = Utils.getAccountTypeText(user.accountType);
            
            // 加载侧边栏头像
            await loadSidebarAvatar();
        }

        // 加载侧边栏头像
        async function loadSidebarAvatar() {
            try {
                const user = Utils.getUser();
                if (!user) return;

                const response = await Utils.get(`/users/${user.id}/avatar`);
                const avatarPath = response.avatarPath;

                const sidebarAvatarImage = document.getElementById('sidebarAvatarImage');
                const sidebarAvatarIcon = document.getElementById('sidebarAvatarIcon');

                if (avatarPath) {
                    sidebarAvatarImage.src = avatarPath;
                    sidebarAvatarImage.style.display = 'block';
                    sidebarAvatarIcon.style.display = 'none';
                } else {
                    sidebarAvatarImage.style.display = 'none';
                    sidebarAvatarIcon.style.display = 'block';
                }
            } catch (error) {
                console.error('加载侧边栏头像失败:', error);
            }
        }

        // 切换存储类型
        function switchStorage(storageType) {
            currentStorageType = storageType;
            
            // 更新标签状态
            document.querySelectorAll('.storage-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`[data-type="${storageType}"]`).classList.add('active');
            
            // 重新加载文件列表
            loadFiles();
        }

        // 加载文件列表
        async function loadFiles() {
            try {
                const params = new URLSearchParams({
                    storageType: currentStorageType,
                    directory: currentDirectory
                });
                
                const response = await Utils.get(`/storage/files?${params}`);
                const files = response.files || [];
                const folders = response.folders || [];
                const container = document.getElementById('filesList');
                
                // 更新当前路径显示
                updateCurrentPath();
                
                // 更新返回按钮状态
                const backBtn = document.getElementById('backBtn');
                backBtn.style.display = currentDirectory ? 'flex' : 'none';
                
                // 获取当前路径的滚动位置
                const pathKey = currentStorageType + ':' + (currentDirectory || 'root');
                const savedScrollTop = scrollPositions.get(pathKey) || 0;
                
                // 合并文件夹和文件，并按名称排序
                const allItems = [...folders, ...files].sort((a, b) => {
                    // 文件夹排在前面
                    if (a.type === 'folder' && b.type !== 'folder') return -1;
                    if (a.type !== 'folder' && b.type === 'folder') return 1;
                    // 按名称排序
                    return a.filename.localeCompare(b.filename);
                });
                
                if (allItems.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <p>暂无文件数据</p>
                        </div>
                    `;
                    return;
                }
                
                // 渲染文件和文件夹列表
                let html = '';
                allItems.forEach(item => {
                    if (item.type === 'folder') {
                        // 渲染文件夹
                        html += `
                            <div class="file-item" onclick="openFolder('${item.filename}')">
                                <div class="file-info">
                                    <div class="file-icon folder">
                                        <i class="fas fa-folder"></i>
                                    </div>
                                    <div class="file-details">
                                        <div class="file-name">${item.filename}</div>
                                        <div class="file-meta">
                                            <span>文件夹</span>
                                            <span>${Utils.formatDateTime(item.createTime)}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="file-actions">
                                    <div class="file-action-wrapper" style="position: relative;">
                                        <button class="file-action-btn more" onclick="event.stopPropagation(); toggleContextMenu('${item.filename}', 'folder', event)">
                                            <i class="fas fa-ellipsis-h"></i>
                                        </button>
                                        <div class="context-menu" id="menu-${item.filename}">
                                            <button class="context-menu-item" onclick="event.stopPropagation(); openFolder('${item.filename}')">
                                                <i class="fas fa-folder-open"></i>
                                                <span>打开</span>
                                            </button>
                                            <button class="context-menu-item" onclick="event.stopPropagation(); deleteFolder('${item.filename}')">
                                                <i class="fas fa-trash"></i>
                                                <span>删除</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        // 渲染文件
                        const fileSize = formatFileSize(item.size);
                        const uploadTime = Utils.formatDateTime(item.uploadTime);
                        
                        // 获取文件扩展名和图标
                        const fileExtension = getFileExtension(item.filename);
                        const fileIconClass = getFileIconClass(fileExtension);
                        const fileIcon = getFileIcon(fileExtension);
                        
                        html += `
                            <div class="file-item">
                                <div class="file-info">
                                    <div class="file-icon ${fileIconClass}">
                                        <i class="fas ${fileIcon}"></i>
                                    </div>
                                    <div class="file-details">
                                        <div class="file-name">${item.filename}</div>
                                        <div class="file-meta">
                                            <span>${fileSize}</span>
                                            <span>${uploadTime}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="file-actions">
                                    <div class="file-action-wrapper" style="position: relative;">
                                        <button class="file-action-btn more" onclick="event.stopPropagation(); toggleContextMenu('${item.filename}', 'file', event)">
                                            <i class="fas fa-ellipsis-h"></i>
                                        </button>
                                        <div class="context-menu" id="menu-${item.filename}" style="z-index: 9999">
                                            <button class="context-menu-item" onclick="event.stopPropagation(); previewFile('${item.filename}', '${item.path}', '${fileExtension}')">
                                                <i class="fas fa-eye"></i>
                                                <span>预览</span>
                                            </button>
                                            <button class="context-menu-item" onclick="event.stopPropagation(); downloadFile('${item.filename}', '${item.path}')">
                                                <i class="fas fa-download"></i>
                                                <span>下载</span>
                                            </button>
                                            <button class="context-menu-item" onclick="event.stopPropagation(); showMoveDialog('${item.filename}')">
                                                <i class="fas fa-arrows-alt"></i>
                                                <span>移动</span>
                                            </button>
                                            <button class="context-menu-item" onclick="event.stopPropagation(); showCopyDialog('${item.filename}')">
                                                <i class="fas fa-copy"></i>
                                                <span>复制</span>
                                            </button>
                                            <button class="context-menu-item" onclick="event.stopPropagation(); shareFile('${item.filename}')">
                                                <i class="fas fa-share-alt"></i>
                                                <span>分享</span>
                                            </button>
                                            <div class="context-menu-divider"></div>

            try {

                const existingFile = files.find(f => f.filename === file.name);

        // 下载文件
        async function downloadFile(filename, filePath) {
            try {
                const token = Utils.getToken();
                if (!token) {
                    showAlert('请先登录', '错误', 'fa-exclamation-circle', '#dc3545');
                    return;
                }
                
                const params = new URLSearchParams({
                    storageType: currentStorageType,
                    directory: currentDirectory
                });
                
                // 对文件名进行URL编码，确保中文文件名和特殊字符能正确处理
                const encodedFilename = encodeURIComponent(filename);
                const downloadUrl = `/storage/download/${encodedFilename}?${params}`;
                
                console.log('下载URL:', Utils.BASE_URL + downloadUrl);
                
                // 使用fetch进行认证下载
                const response = await fetch(Utils.BASE_URL + downloadUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('文件不存在');
                    } else if (response.status === 401) {
                        throw new Error('认证失败，请重新登录');
                    } else {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error || `下载失败 (${response.status})`);
                    }
                }
                
                // 获取文件blob
                const blob = await response.blob();
                
                // 创建下载链接
                const link = document.createElement('a');
                const url = window.URL.createObjectURL(blob);
                link.href = url;
                link.download = filename; // 保持原始文件名作为下载文件名
                link.style.display = 'none';
                
                // 添加到DOM并触发点击
                document.body.appendChild(link);
                link.click();
                
                // 清理资源
                setTimeout(() => {
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(url);
                }, 100);
                
                console.log('文件下载成功:', filename);
                
            } catch (error) {
                console.error('下载文件错误:', error);
                showAlert('下载失败: ' + error.message, '错误', 'fa-exclamation-circle', '#dc3545');
            }
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 获取文件扩展名
        function getFileExtension(filename) {
            return filename.split('.').pop().toLowerCase();

        // 根据文件扩展名获取图标类名
        function getFileIconClass(extension) {
            const imageTypes = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'];
            const documentTypes = ['doc', 'docx', 'rtf', 'odt'];
            const pdfTypes = ['pdf'];
            const excelTypes = ['xls', 'xlsx', 'csv'];
            const powerpointTypes = ['ppt', 'pptx'];
            const videoTypes = ['mp4', 'avi', 'mov', 'wmv', 'flv', 'webm', 'mkv'];
            const audioTypes = ['mp3', 'wav', 'flac', 'aac', 'ogg', 'wma'];
            const archiveTypes = ['zip', 'rar', '7z', 'tar', 'gz'];
            const codeTypes = ['js', 'html', 'css', 'json', 'xml', 'py', 'java', 'cpp', 'c'];
            const textTypes = ['txt', 'md'];

            if (imageTypes.includes(extension)) return 'image';
            if (documentTypes.includes(extension)) return 'document';
            if (pdfTypes.includes(extension)) return 'pdf';
            if (excelTypes.includes(extension)) return 'excel';
            if (powerpointTypes.includes(extension)) return 'powerpoint';
            if (videoTypes.includes(extension)) return 'video';
            if (audioTypes.includes(extension)) return 'audio';
            if (archiveTypes.includes(extension)) return 'archive';
            if (codeTypes.includes(extension)) return 'code';
            if (textTypes.includes(extension)) return 'text';
            
            return 'default';
        }

        // 根据文件扩展名获取图标
        function getFileIcon(extension) {
            const imageTypes = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'];
            const documentTypes = ['doc', 'docx', 'rtf', 'odt'];
            const pdfTypes = ['pdf'];
            const excelTypes = ['xls', 'xlsx', 'csv'];
            const powerpointTypes = ['ppt', 'pptx'];
            const videoTypes = ['mp4', 'avi', 'mov', 'wmv', 'flv', 'webm', 'mkv'];
            const audioTypes = ['mp3', 'wav', 'flac', 'aac', 'ogg', 'wma'];
            const archiveTypes = ['zip', 'rar', '7z', 'tar', 'gz'];
            const codeTypes = ['js', 'html', 'css', 'json', 'xml', 'py', 'java', 'cpp', 'c'];
            const textTypes = ['txt', 'md'];

            if (imageTypes.includes(extension)) return 'fa-file-image';
            if (documentTypes.includes(extension)) return 'fa-file-word';
            if (pdfTypes.includes(extension)) return 'fa-file-pdf';
            if (excelTypes.includes(extension)) return 'fa-file-excel';

        // 文件预览功能
        async function previewFile(filename, filePath, extension) {
            currentPreviewFile = { filename, filePath, extension };
            
            const modal = document.getElementById('previewModal');
            const titleElement = document.getElementById('previewModalTitle');
            const contentElement = document.getElementById('previewContent');
            
            titleElement.textContent = `预览 - ${filename}`;
            
            // 根据文件类型显示不同的预览内容
            if (isImageFile(extension)) {
                await showImagePreview(filename, filePath, contentElement);
            } else if (isVideoFile(extension)) {
                await showVideoPreview(filename, filePath, contentElement);
            } else if (isAudioFile(extension)) {
                await showAudioPreview(filename, filePath, contentElement);
            } else if (isTextFile(extension)) {
                await showTextPreview(filename, filePath, contentElement);
            } else if (isPdfFile(extension)) {
                await showPdfPreview(filename, filePath, contentElement);
            } else {
                showUnsupportedPreview(filename, extension, contentElement);
            }
            
            modal.style.display = 'flex';
            modal.classList.add('show');
        }

        // 判断文件类型的辅助函数
        function isImageFile(extension) {
            return ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico'].includes(extension);
        }

        function isVideoFile(extension) {
            return ['mp4', 'webm', 'ogg'].includes(extension);
        }

        function isAudioFile(extension) {
            return ['mp3', 'wav', 'ogg'].includes(extension);
        }

        function isTextFile(extension) {
            return ['txt', 'md', 'js', 'html', 'css', 'json', 'xml'].includes(extension);
        }

        function isPdfFile(extension) {
            return extension === 'pdf';
        }

                const response = await fetch(imageUrl, {

                    }
                });
                
                if (!response.ok) {
                    throw new Error('图片加载失败');
                }
                
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                contentElement.innerHTML = `<img src="${blobUrl}" alt="${filename}" />`;
                
                // 当模态框关闭时清理 blob URL
                const currentModal = document.getElementById('previewModal');
                const originalClose = currentModal.onclose || (() => {});
                currentModal.addEventListener('hide', () => {

            } catch (error) {

                contentElement.innerHTML = '<div class="unsupported-preview"><i class="fas fa-exclamation-triangle"></i><p>图片加载失败</p></div>';

            const token = Utils.getToken();
            if (!token) {
                throw new Error('未登录');
            }
            
            const params = new URLSearchParams({
                storageType: currentStorageType,
                directory: currentDirectory
            });
            
            const encodedFilename = encodeURIComponent(filename);
            return `${Utils.BASE_URL}/storage/download/${encodedFilename}?${params}`;
        }

        // 加载文本文件内容
        async function loadTextFile(filename) {
            const url = await getFileUrl(filename);
            const token = Utils.getToken();
            
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            if (!response.ok) {
                throw new Error('无法加载文件');
            }
            return await response.text();
        }

            const extension = getFileExtension(filename);
            const videoTypes = {
                'mp4': 'mp4',
                'webm': 'webm',
                'ogg': 'ogg'
            };
            return videoTypes[extension] || 'mp4';
        }

        // 获取音频类型
        function getAudioType(filename) {
            const extension = getFileExtension(filename);
            const audioTypes = {
                'mp3': 'mpeg',
                'wav': 'wav',
                'ogg': 'ogg'
            };
            return audioTypes[extension] || 'mpeg';
        }

            if (window.currentAudioBlob) {
                URL.revokeObjectURL(window.currentAudioBlob);
                window.currentAudioBlob = null;
            }
            
            // 清理预览内容中的所有 blob URLs
            const contentElement = document.getElementById('previewContent');
            const imgs = contentElement.querySelectorAll('img');
            const videos = contentElement.querySelectorAll('video source');
            const audios = contentElement.querySelectorAll('audio source');
            
            imgs.forEach(img => {
                if (img.src.startsWith('blob:')) {
                    URL.revokeObjectURL(img.src);
                }
            });
            
            videos.forEach(source => {
                if (source.src.startsWith('blob:')) {
                    URL.revokeObjectURL(source.src);
                }
            });
            
            audios.forEach(source => {
                if (source.src.startsWith('blob:')) {

            });

        // 切换上下文菜单显示
        function toggleContextMenu(filename, type, event) {
            // 关闭所有其他菜单
            closeAllContextMenus();
            
            const menu = document.getElementById(`menu-${filename}`);
            if (menu) {
                // 获取点击位置
                const clickX = event.clientX;
                const clickY = event.clientY;
                
                // 先显示菜单以获取实际尺寸（但透明度为0，避免闪烁）
                menu.style.opacity = '0';
                menu.style.visibility = 'hidden';
                menu.classList.add('show');
                
                // 获取菜单实际尺寸
                const menuRect = menu.getBoundingClientRect();
                const menuWidth = menuRect.width || 160;
                const menuHeight = menuRect.height || 200;
                
                // 恢复可见性
                menu.style.opacity = '';
                menu.style.visibility = '';
                
                // 屏幕边界
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                
                // 计算菜单位置，确保不超出屏幕
                let left = clickX;
                let top = clickY;
                
                // 优先考虑右边界，因为菜单通常在点击位置下方展开
                if (left + menuWidth > screenWidth) {
                    // 右侧空间不足，向左偏移
                    left = screenWidth - menuWidth - 10;
                }
                
                // 检查左边界
                if (left < 10) {
                    left = 10;
                }
                
                // 重点检查下边界 - 这是最常见的问题
                if (top + menuHeight > screenHeight) {
                    // 下方空间不足，向上展开
                    top = clickY - menuHeight - 10;
                    
                    // 如果向上展开也会超出上边界，则居中显示
                    if (top < 10) {
                        top = (screenHeight - menuHeight) / 2;
                    }
                }
                
                // 检查上边界
                if (top < 10) {
                    top = 10;
                }
                
                // 设置菜单位置
                menu.style.left = left + 'px';
                menu.style.top = top + 'px';
                
                // 添加全局点击监听器来关闭菜单
                setTimeout(() => {
                    document.addEventListener('click', hideContextMenuOnClickOutside);
                }, 100);
            }
        }

            const titleElement = document.getElementById('confirmModalTitle');
            const messageElement = document.getElementById('confirmModalMessage');
            const iconElement = document.getElementById('confirmModalIcon');
            
            titleElement.textContent = title;
            messageElement.textContent = message;
            iconElement.className = `fas ${icon}`;
            iconElement.style.color = iconColor;
            
            confirmCallback = callback;
            modal.style.display = 'flex';
            modal.classList.add('show');
        }

        // 关闭确认对话框
        function closeConfirmDialog(result) {
            const modal = document.getElementById('confirmModal');
            modal.style.display = 'none';
            modal.classList.remove('show');
            
            if (confirmCallback) {
                confirmCallback(result);
                confirmCallback = null;
            }
        }

        // 显示文件冲突对话框
        function showFileConflictDialog(filename, operation, targetPath, callback) {
            const modal = document.getElementById('fileConflictModal');
            const titleElement = document.getElementById('fileConflictModalTitle');
            const messageElement = document.getElementById('fileConflictModalMessage');
            const iconElement = document.getElementById('fileConflictModalIcon');
            
            const operationText = operation === 'move' ? '移动' : '复制';
            titleElement.textContent = '文件冲突';
            messageElement.textContent = `目标位置已存在同名文件 "${filename}"，请选择处理方式：`;
            iconElement.className = 'fas fa-exclamation-triangle';
            iconElement.style.color = '#ffc107';
            
            fileConflictCallback = callback;
            modal.style.display = 'flex';
            modal.classList.add('show');
        }

        // 处理文件冲突操作
        function handleFileConflictAction(action) {
            const modal = document.getElementById('fileConflictModal');
            modal.style.display = 'none';
            modal.classList.remove('show');
            
            if (fileConflictCallback) {
                fileConflictCallback(action);
                fileConflictCallback = null;
            }
        }

        // 关闭文件冲突对话框
        function closeFileConflictDialog() {
            const modal = document.getElementById('fileConflictModal');
            modal.style.display = 'none';
            modal.classList.remove('show');
            
            if (fileConflictCallback) {
                fileConflictCallback('cancel');
                fileConflictCallback = null;
            }
        }


    </script>

    <script>
        // 便签数据存储
        let notes = [];
        let currentNoteId = null;
        let searchQuery = '';
        let selectedColor = 'all'; // 默认显示全部便签
        let currentNoteColor = 'none'; // 当前编辑便签的颜色
        
        // 自动保存功能
        let autoSaveTimer = null;
        const AUTO_SAVE_INTERVAL = 3000; // 自动保存间隔（毫秒）
        let lastSavedContent = '';
        let isEditing = false;
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', async function() {
            // 初始化侧边栏和菜单
            MobileCommon.checkAuth();
            await MobileCommon.loadSidebarAvatar();
            MobileCommon.setupNavigation();
            
            // 从本地存储恢复筛选状态
            const savedFilterColor = localStorage.getItem('notesFilterColor');
            if (savedFilterColor) {
                selectedColor = savedFilterColor;
            }
                       
            // 加载便签数据
            await loadNotes();
            
            
            // 恢复筛选状态的UI显示
            // 无论是否有保存的筛选状态，都设置UI状态
            const colorToShow = savedFilterColor || 'all';
            const event = { target: document.querySelector(colorToShow === 'all' ? '.show-all-btn' : `.color-preset-btn.${colorToShow}`) };
            selectNoteColor(colorToShow, event);
            
            
            // 初始化置顶复选框事件监听器
            setupPinCheckbox();
            
            // 初始化自动保存复选框事件监听器
            setupAutoSaveCheckbox();
            
            // 初始化编辑器，确保DOM元素都已准备好
            try {
                editor = new RichTextEditor({
                    editorElement: document.getElementById('editorContent'),
                    sourceElement: document.getElementById('editorSource'),
                    toolbarElement: document.getElementById('editorToolbar'),
                    autoSaveIndicator: document.getElementById('autoSaveIndicator')
                });
                console.log('富文本编辑器初始化成功');
                console.log('编辑器方法:', Object.getOwnPropertyNames(editor.__proto__));
                
                // 验证必要方法是否存在
                if (typeof editor.setTextColor === 'function') {
                    console.log('✓ setTextColor 方法可用');
                } else {
                    console.error('✗ setTextColor 方法不可用');
                }
                
                if (typeof editor.setBgColor === 'function') {
                    console.log('✓ setBgColor 方法可用');
                } else {
                    console.error('✗ setBgColor 方法不可用');
                }
                
                if (typeof editor.setFontSize === 'function') {
                    console.log('✓ setFontSize 方法可用');
                } else {
                    console.error('✗ setFontSize 方法不可用');
                }
                
                // 重新绑定工具栏事件
                bindDirectToolbarEvents();
                console.log('工具栏事件绑定完成');
                
                // 初始化模式按钮状态
                editor.updateModeButtons();
                
            } catch (error) {
                console.error('富文本编辑器初始化失败:', error);
            }

        });
        
        
      
        // 从API加载便签
        async function loadNotes() {
            try {
                const response = await fetch('/api/notes', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${Utils.getToken()}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('加载便签失败');
                }
                
                const result = await response.json();
                if (result.success && Array.isArray(result.data)) {
                    notes = result.data;
                } else if (result.success && !Array.isArray(result.data)) {
                    // 如果返回的数据不是数组，将其转换为数组
                    notes = [result.data];
                } else {
                    throw new Error(result.message || '加载便签失败');
                }
            } catch (error) {
                console.error('加载便签失败:', error);
                Utils.showError(error.message || '加载便签失败');
                // 确保notes始终是数组
                notes = [];
            } finally {
                // 数据加载完成后，重新渲染便签列表
                filterNotesByColor(selectedColor || 'all');
            }
        }
        
        
        
        


        
        // 新的富文本编辑器类
        class RichTextEditor {
            constructor(options = {}) {
                this.editorElement = options.editorElement;
                this.sourceElement = options.sourceElement;
                this.toolbarElement = options.toolbarElement;
                this.autoSaveIndicator = options.autoSaveIndicator;
                this.isSourceMode = false;
                this.history = [];
                this.historyIndex = -1;
                this.maxHistoryLength = 50;
                this.lastContent = '';
                
                // 添加字体和大小配置（参考notes.html）
                this.fontSizes = [
                    { name: '小', value: '12px' },
                    { name: '正常', value: '16px' },
                    { name: '中', value: '20px' },
                    { name: '大', value: '24px' },
                    { name: '特大', value: '32px' }
                ];
                
                this.fontFamilies = [
                    { name: '默认', value: 'inherit' },
                    { name: 'Arial', value: 'Arial, sans-serif' },
                    { name: '宋体', value: 'SimSun, serif' },
                    { name: '微软雅黑', value: 'Microsoft YaHei, sans-serif' },
                    { name: 'Courier New', value: 'Courier New, monospace' },
                    { name: 'Georgia', value: 'Georgia, serif' }
                ];
                
                this.init();
            }
            
            // 设置文字颜色（参考notes.html实现）
            setTextColor(color) {
                if (this.isSourceMode) return;
                
                this.focus();
                document.execCommand('foreColor', false, color);
                this.saveToHistory();
                this.updateAutoSave();
            }
            
            // 设置背景颜色（参考notes.html实现）
            setBgColor(color) {
                if (this.isSourceMode) return;
                
                this.focus();
                document.execCommand('backColor', false, color);
                this.saveToHistory();
                this.updateAutoSave();
            }
            
            // 设置字体大小（参考notes.html实现）
            setFontSize(size) {
                if (this.isSourceMode) return;
                
                this.focus();
                document.execCommand('fontSize', false, 7); // 先设置默认大小
                const fontElements = this.editorElement.querySelectorAll('font[size]');
                fontElements.forEach(el => {
                    el.removeAttribute('size');
                    el.style.fontSize = size;
                });
                this.saveToHistory();
                this.updateAutoSave();
            }
            
            init() {
                this.bindEvents();
                this.setupMobileToolbar();
                this.autoResizeContent();
                this.autoResizeSource();
                this.saveToHistory();
                
                // 延迟更新工具栏状态，确保DOM完全加载
                setTimeout(() => {
                    this.updateToolbarState();
                    this.updateModeButtons();
                }, 100);
            }
            
            bindEvents() {
                const editor = this.editorElement;
                const source = this.sourceElement;
                
                // 编辑器输入事件
                editor.addEventListener('input', () => {
                    this.onInput();
                    this.updateToolbarState();
                });
                
                editor.addEventListener('paste', (e) => {
                    this.handlePaste(e);
                });
                                
                // 编辑器鼠标事件，用于更新工具栏状态
                editor.addEventListener('mouseup', () => {
                    this.updateToolbarState();
                });
                
                editor.addEventListener('keyup', () => {
                    this.updateToolbarState();
                });
                
                // 源代码模式输入事件
                source.addEventListener('input', () => {
                    this.onInput();
                    this.autoResizeSource();
                });
                
                // 绑定工具栏按钮事件
                this.bindToolbarEvents();
            }
            
            bindToolbarEvents() {
                // 绑定下拉选择框事件（参考notes.html实现）
                const selects = this.toolbarElement.querySelectorAll('.toolbar-select');
                selects.forEach(select => {
                    select.addEventListener('change', (e) => {
                        const command = select.dataset.command;
                        const value = select.value;
                        
                        if (command === 'fontSize') {
                            this.setFontSize(value);
                        } else if (command === 'fontName') {
                            this.focus();
                            document.execCommand('fontName', false, value);
                            this.saveToHistory();
                        }
                        
                        this.updateAutoSave();
                    });
                });
                
                // 绑定颜色选择器事件（参考notes.html实现）
                const colorInput = this.toolbarElement.querySelector('.toolbar-color');
                if (colorInput) {
                    colorInput.addEventListener('input', (e) => {
                        this.setTextColor(e.target.value);
                    });
                }
 
                // 绑定背景颜色选择器事件（参考notes.html实现）
                const bgColorInput = this.toolbarElement.querySelector('.toolbar-bg-color');
                if (bgColorInput) {
                    bgColorInput.addEventListener('input', (e) => {
                        this.setBgColor(e.target.value);
                    });
                }
                
                // 注释掉重复的事件绑定，避免按钮被点击两次
                // HTML中的onclick属性已经足够，不需要额外的addEventListener
                /*
                const buttonsWithOnclick = this.toolbarElement.querySelectorAll('.editor-btn[onclick]');
                buttonsWithOnclick.forEach(btn => {
                    // 为已有onclick的按钮添加额外的处理
                    const originalOnclick = btn.getAttribute('onclick');
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        // 执行原始的onclick函数
                        try {
                            eval(originalOnclick);
                        } catch (err) {
                            console.error('执行onclick函数失败:', err);
                        }
                    });
                });
                */
            }
            
            // 设置移动端工具栏
            setupMobileToolbar() {
                // 检测是否为移动端
                const isMobile = window.innerWidth <= 767;
                const toolbar = this.toolbarElement;
                
                if (isMobile && toolbar) {
                    // 添加移动端工具栏类
                    toolbar.classList.add('mobile-toolbar');
                    
                    // 创建工具栏展开/收起按钮
                    const toggleBtn = document.getElementById('toggleToolbarBtn');
                    if (toggleBtn) {
                        // 默认在移动端显示简化工具栏
                        this.isMobileToolbarExpanded = false;
                        toolbar.classList.remove('expanded');
                        
                        // 为收起/展开按钮添加移动端特殊处理
                        toggleBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            this.toggleMobileToolbar();
                        });
                    }
                    
                    // 监听屏幕旋转
                    window.addEventListener('orientationchange', () => {
                        setTimeout(() => {
                            this.setupMobileToolbar();
                        }, 100);
                    });
                } else if (toolbar) {
                    toolbar.classList.remove('mobile-toolbar', 'expanded');
                }
            }
            
            // 切换移动端工具栏显示状态
            toggleMobileToolbar() {
                if (window.innerWidth <= 767) {
                    const toolbar = this.toolbarElement;
                    if (toolbar) {
                        this.isMobileToolbarExpanded = !this.isMobileToolbarExpanded;
                        
                        if (this.isMobileToolbarExpanded) {
                            toolbar.classList.add('expanded');
                        } else {
                            toolbar.classList.remove('expanded');
                        }
                        
                        // 更新按钮文本和图标
                        const icon = document.getElementById('toolbarIcon');
                        const text = document.getElementById('toolbarText');
                        
                        if (icon && text) {
                            if (this.isMobileToolbarExpanded) {
                                icon.className = 'fas fa-chevron-up';
                                text.textContent = '收起工具栏';
                            } else {
                                icon.className = 'fas fa-chevron-down';
                                text.textContent = '展开工具栏';
                            }
                        }
                    }
                }
            }
            

            
            onInput() {
                this.autoResize();
                clearTimeout(this.inputTimer);
                this.inputTimer = setTimeout(() => {
                    this.saveToHistory();
                    this.updateAutoSave();
                }, 500);
            }
            
            // 自动调整编辑器高度
            autoResize() {
                if (this.isSourceMode) {
                    this.autoResizeSource();
                } else {
                    this.autoResizeContent();
                }
            }
            
            // 调整内容编辑模式的高度
            autoResizeContent() {
                const editor = this.editorElement;
                // 移除高度限制，让编辑器完全适应内容高度
                editor.style.height = 'auto';
                editor.style.height = editor.scrollHeight + 'px';
            }
            
            // 调整源代码模式的高度
            autoResizeSource() {
                const source = this.sourceElement;
                // 移除高度限制，让编辑器完全适应内容高度
                source.style.height = 'auto';
                
                // 始终将高度设置为内容的总高度，确保所有文本都能显示
                source.style.height = source.scrollHeight + 'px';
            }
            
            saveToHistory() {
                const content = this.getContent();
                if (this.historyIndex >= 0 && this.history[this.historyIndex] === content) {
                    return;
                }
                
                // 清除当前索引之后的历史记录
                if (this.historyIndex < this.history.length - 1) {
                    this.history = this.history.slice(0, this.historyIndex + 1);
                }
                
                this.history.push(content);
                
                if (this.history.length > this.maxHistoryLength) {
                    this.history.shift();
                } else {
                    this.historyIndex++;
                }
            }
            
            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    this.setContent(this.history[this.historyIndex]);
                }
            }
            
            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    this.setContent(this.history[this.historyIndex]);
                }
            }
            
            format(command, value = null) {
                if (this.isSourceMode) return;
                
                this.focus();
                const selection = window.getSelection();
                
                if (selection.rangeCount === 0) return;
                
                const range = selection.getRangeAt(0);
                
                try {
                    // 使用现代DOM API替代document.execCommand
                    switch(command) {
                        case 'bold':
                            this.wrapSelection('b', 'font-weight: bold;');
                            break;
                        case 'italic':
                            this.wrapSelection('i', 'font-style: italic;');
                            break;
                        case 'underline':
                            this.wrapSelection('u', 'text-decoration: underline;');
                            break;
                        case 'strikeThrough':
                            this.wrapSelection('s', 'text-decoration: line-through;');
                            break;
                        case 'insertUnorderedList':
                            this.wrapInList('ul');
                            break;
                        case 'insertOrderedList':
                            this.wrapInList('ol');
                            break;
                        case 'justifyLeft':
                            this.setAlignment('left');
                            break;
                        case 'justifyCenter':
                            this.setAlignment('center');
                            break;
                        case 'justifyRight':
                            this.setAlignment('right');
                            break;
                        case 'justifyFull':
                            this.setAlignment('justify');
                            break;
                        case 'indent':
                            this.indentSelection();
                            break;
                        case 'outdent':
                            this.outdentSelection();
                            break;
                        default:
                            // 回退到execCommand
                            document.execCommand(command, false, value);
                    }
                    
                    this.saveToHistory();
                    this.updateAutoSave();
                } catch (error) {
                    console.error('格式化失败:', error);
                    // 如果现代方法失败，回退到execCommand
                    try {
                        document.execCommand(command, false, value);
                        this.saveToHistory();
                        this.updateAutoSave();
                    } catch (fallbackError) {
                        console.error('回退方法也失败:', fallbackError);
                    }
                }
            }
            
            // 包装选中文本在指定标签中
            wrapSelection(tagName, style = '') {
                const selection = window.getSelection();
                if (selection.rangeCount === 0 || selection.isCollapsed) return;
                
                const range = selection.getRangeAt(0);
                const selectedText = range.toString();
                
                if (!selectedText) return;
                
                // 检查选区是否已经被目标标签包裹
                const commonAncestor = range.commonAncestorContainer;
                let targetElement = null;
                
                // 查找最近的父元素
                let node = commonAncestor.nodeType === 3 ? commonAncestor.parentElement : commonAncestor;
                while (node && node !== this.editorElement) {
                    if (node.tagName === tagName.toUpperCase()) {
                        targetElement = node;
                        break;
                    }
                    node = node.parentElement;
                }
                
                if (targetElement) {
                    // 如果已经存在目标标签，则移除它（取消格式）
                    try {
                        const parent = targetElement.parentNode;
                        const children = Array.from(targetElement.childNodes);
                        
                        // 将子元素移到父元素中
                        children.forEach(child => {
                            parent.insertBefore(child, targetElement);
                        });
                        
                        // 删除空的标签元素
                        parent.removeChild(targetElement);
                        
                        // 重新选择内容
                        const newRange = document.createRange();
                        newRange.setStartBefore(children[0]);
                        newRange.setEndAfter(children[children.length - 1]);
                        selection.removeAllRanges();
                        selection.addRange(newRange);
                        
                    } catch (error) {
                        console.error(`取消格式失败 (${tagName}):`, error);
                    }
                } else {
                    // 如果不存在目标标签，则添加它
                    const element = document.createElement(tagName);
                    if (style) {
                        element.style.cssText = style;
                    }
                    element.textContent = selectedText;
                    
                    try {
                        range.deleteContents();
                        range.insertNode(element);
                        
                        // 重新选择新创建的元素
                        const newRange = document.createRange();
                        newRange.selectNodeContents(element);
                        selection.removeAllRanges();
                        selection.addRange(newRange);
                    } catch (error) {
                        console.error(`包装文本失败 (${tagName}):`, error);
                    }
                }
            }
            
            // 处理当前行的列表转换
            handleCurrentLineForList(listType, selection, range) {
                try {
                    // 获取光标位置
                    const cursorNode = range.startContainer;
                    const cursorOffset = range.startOffset;
                    
                    // 找到当前行所在的块级元素
                    let currentBlock = cursorNode.nodeType === 3 ? cursorNode.parentElement : cursorNode;
                    
                    // 如果当前在列表中，根据类型决定是取消还是切换
                    let existingList = null;
                    let node = currentBlock;
                    while (node && node !== this.editorElement) {
                        if (node.tagName === 'UL' || node.tagName === 'OL') {
                            existingList = node;
                            break;
                        }
                        node = node.parentElement;
                    }
                    
                    if (existingList) {
                        if (existingList.tagName === listType.toUpperCase()) {
                            // 如果已存在相同类型的列表，取消列表
                            this.unlistCurrentItem(existingList, currentBlock, selection);
                        } else {
                            // 如果存在不同类型的列表，切换类型
                            this.switchListType(existingList, listType, selection);
                        }
                    } else {
                        // 如果不在列表中，将当前块级元素转换为列表项
                        this.convertBlockToListItem(currentBlock, listType, selection);
                    }
                } catch (error) {
                    console.error('处理当前行列表失败:', error);
                    // 回退到创建空列表项
                    this.createEmptyListItem(listType, range, selection);
                }
            }
            
            // 取消当前项的列表格式
            unlistCurrentItem(existingList, currentBlock, selection) {
                try {
                    const parent = existingList.parentNode;
                    
                    // 将当前列表项转换为段落
                    const p = document.createElement('p');
                    p.style.margin = '5px 0';
                    
                    if (currentBlock.tagName === 'LI') {
                        // 当前本身就是列表项
                        p.innerHTML = currentBlock.innerHTML;
                        parent.insertBefore(p, existingList);
                        
                        // 如果列表只有这一项，删除整个列表
                        if (existingList.children.length === 1) {
                            parent.removeChild(existingList);
                        } else {
                            existingList.removeChild(currentBlock);
                        }
                    }
                    
                    // 将光标定位到新段落
                    const newRange = document.createRange();
                    newRange.selectNodeContents(p);
                    newRange.collapse(false);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                } catch (error) {
                    console.error('取消列表失败:', error);
                }
            }
            
            // 切换列表类型
            switchListType(existingList, newListType, selection) {
                try {
                    const newList = document.createElement(newListType);
                    newList.innerHTML = existingList.innerHTML;
                    
                    // 设置列表样式
                    newList.style.margin = '10px 0';
                    newList.style.paddingLeft = '20px';
                    if (newListType === 'ol') {
                        newList.style.listStyleType = 'decimal';
                    } else {
                        newList.style.listStyleType = 'disc';
                    }
                    
                    existingList.parentNode.replaceChild(newList, existingList);
                    
                    // 重新选择内容
                    const newRange = document.createRange();
                    newRange.selectNodeContents(newList);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                } catch (error) {
                    console.error('切换列表类型失败:', error);
                }
            }
            
            // 将块级元素转换为列表项
            convertBlockToListItem(blockElement, listType, selection) {
                try {
                    const li = document.createElement('li');
                    
                    // 获取块级元素的内容
                    let content = '';
                    if (blockElement.tagName === 'P' || blockElement.tagName === 'DIV') {
                        content = blockElement.innerHTML;
                    } else {
                        content = blockElement.textContent;
                    }
                    
                    li.innerHTML = content || '<br>'; // 确保至少有一个换行符
                    li.style.marginBottom = '4px';
                    
                    const list = document.createElement(listType);
                    list.appendChild(li);
                    
                    // 设置列表样式
                    list.style.margin = '10px 0';
                    list.style.paddingLeft = '20px';
                    if (listType === 'ol') {
                        list.style.listStyleType = 'decimal';
                    } else {
                        list.style.listStyleType = 'disc';
                    }
                    
                    // 替换原块级元素
                    if (blockElement.parentNode) {
                        blockElement.parentNode.replaceChild(list, blockElement);
                    }
                    
                    // 将光标定位到列表项中
                    const newRange = document.createRange();
                    newRange.selectNodeContents(li);
                    newRange.collapse(false); // 光标到末尾
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                } catch (error) {
                    console.error('转换为列表项失败:', error);
                }
            }
            
            // 创建空列表项（回退方案）
            createEmptyListItem(listType, range, selection) {
                const li = document.createElement('li');
                li.innerHTML = '<br>';
                li.style.minHeight = '1.2em';
                
                const list = document.createElement(listType);
                list.appendChild(li);
                
                // 设置列表样式
                list.style.margin = '10px 0';
                list.style.paddingLeft = '20px';
                if (listType === 'ol') {
                    list.style.listStyleType = 'decimal';
                } else {
                    list.style.listStyleType = 'disc';
                }
                
                try {
                    range.insertNode(list);
                    
                    const newRange = document.createRange();
                    newRange.setStart(li, 0);
                    newRange.collapse(true);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                } catch (error) {
                    console.error('创建空列表失败:', error);
                }
            }
            
            // 将选中文本转换为列表
            wrapInList(listType) {
                const selection = window.getSelection();
                if (selection.rangeCount === 0) return;
                
                const range = selection.getRangeAt(0);
                const selectedText = range.toString();
                
                // 首先检查是否已经在相同类型的列表中
                const commonAncestor = range.commonAncestorContainer;
                let existingList = null;
                
                // 查找最近的列表父元素
                let node = commonAncestor.nodeType === 3 ? commonAncestor.parentElement : commonAncestor;
                while (node && node !== this.editorElement) {
                    if (node.tagName === 'UL' || node.tagName === 'OL') {
                        existingList = node;
                        break;
                    }
                    node = node.parentElement;
                }
                
                if (existingList && existingList.tagName === listType.toUpperCase()) {
                    // 如果已存在相同类型的列表，则取消列表
                    try {
                        const parent = existingList.parentNode;
                        const listItems = Array.from(existingList.children);
                        
                        // 将每个列表项转换为普通段落
                        listItems.forEach((li, index) => {
                            const p = document.createElement('p');
                            p.innerHTML = li.innerHTML;
                            p.style.margin = '5px 0';
                            
                            if (index === 0) {
                                parent.insertBefore(p, existingList);
                            } else {
                                parent.appendChild(p);
                            }
                        });
                        
                        // 删除原列表
                        parent.removeChild(existingList);
                        
                        // 重新选择内容
                        const newRange = document.createRange();
                        const firstP = parent.querySelector('p');
                        if (firstP) {
                            newRange.selectNodeContents(firstP);
                        }
                        selection.removeAllRanges();
                        selection.addRange(newRange);
                        
                    } catch (error) {
                        console.error(`取消列表失败 (${listType}):`, error);
                    }
                    return;
                }
                
                if (existingList) {
                    // 如果已存在不同类型的列表，改变列表类型
                    const newList = document.createElement(listType);
                    newList.innerHTML = existingList.innerHTML;
                    
                    // 设置列表样式
                    newList.style.margin = '10px 0';
                    newList.style.paddingLeft = '20px';
                    if (listType === 'ol') {
                        newList.style.listStyleType = 'decimal';
                    } else {
                        newList.style.listStyleType = 'disc';
                    } 
                    
                    existingList.parentNode.replaceChild(newList, existingList);
                    
                    // 重新选择内容
                    const newRange = document.createRange();
                    newRange.selectNodeContents(newList);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                    return;
                }
                
                if (!selectedText || selectedText.trim() === '') {
                    // 如果没有选中文本，处理当前行
                    this.handleCurrentLineForList(listType, selection, range);
                    return;
                }
                
                // 按行分割文本并创建列表
                const lines = selectedText.split('\n').filter(line => line.trim());
                const list = document.createElement(listType);
                
                // 设置列表样式
                list.style.margin = '10px 0';
                list.style.paddingLeft = '20px';
                if (listType === 'ol') {
                    list.style.listStyleType = 'decimal';
                } else {
                    list.style.listStyleType = 'disc';
                }
                
                lines.forEach((line, index) => {
                    const li = document.createElement('li');
                    li.textContent = line.trim();
                    // 添加底部间距让列表项更清晰
                    li.style.marginBottom = '4px';
                    list.appendChild(li);
                });
                
                let modernMethodSuccess = false;
                try {
                    range.deleteContents();
                    range.insertNode(list);
                    modernMethodSuccess = true;
                    
                    // 将光标移到列表最后的位置
                    const newRange = document.createRange();
                    newRange.selectNodeContents(list);
                    newRange.collapse(false); // false表示折叠到末尾
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                    
                } catch (error) {
                    console.error('现代方法创建列表失败:', error);
                    modernMethodSuccess = false;
                }
                
                // 只有在现代方法失败时才回退到execCommand
                if (!modernMethodSuccess) {
                    console.log('回退到execCommand方法');
                    try {
                        document.execCommand(listType === 'ul' ? 'insertUnorderedList' : 'insertOrderedList', false, null);
                    } catch (fallbackError) {
                        console.error('回退列表创建也失败:', fallbackError);
                    }
                }
            }
            
            // 设置文本对齐
            setAlignment(align) {
                const selection = window.getSelection();
                if (selection.rangeCount === 0) return;
                
                const range = selection.getRangeAt(0);
                let blockElement = this.getBlockElement(range);
                
                if (blockElement) {
                    blockElement.style.textAlign = align;
                } else {
                    // 如果没有块元素，创建一个div
                    const div = document.createElement('div');
                    div.style.textAlign = align;
                    
                    try {
                        range.surroundContents(div);
                    } catch (error) {
                        // 如果surroundContents失败，使用其他方法
                        const selectedText = range.toString();
                        range.deleteContents();
                        div.textContent = selectedText;
                        range.insertNode(div);
                    }
                }
            }
            
            // 增加缩进
            indentSelection() {
                const selection = window.getSelection();
                if (selection.rangeCount === 0) return;
                
                const range = selection.getRangeAt(0);
                let blockElement = this.getBlockElement(range);
                
                if (blockElement) {
                    const currentMargin = parseInt(blockElement.style.marginLeft) || 0;
                    blockElement.style.marginLeft = (currentMargin + 40) + 'px';
                } else {
                    // 创建带缩进的div
                    const div = document.createElement('div');
                    div.style.marginLeft = '40px';
                    
                    try {
                        range.surroundContents(div);
                    } catch (error) {
                        const selectedText = range.toString();
                        range.deleteContents();
                        div.textContent = selectedText;
                        range.insertNode(div);
                    }
                }
            }
            
            // 减少缩进
            outdentSelection() {
                const selection = window.getSelection();
                if (selection.rangeCount === 0) return;
                
                const range = selection.getRangeAt(0);
                let blockElement = this.getBlockElement(range);
                
                if (blockElement) {
                    const currentMargin = parseInt(blockElement.style.marginLeft) || 0;
                    if (currentMargin > 0) {
                        blockElement.style.marginLeft = Math.max(0, currentMargin - 40) + 'px';
                    }
                }
            }
            
            setHeading(tag) {
                if (this.isSourceMode) return;
                
                this.focus();
                const selection = window.getSelection();
                
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    const blockElement = this.getBlockElement(range);
                    const text = range.toString() || '标题';
                    
                    if (blockElement) {
                        // 替换现有块元素
                        const newElement = document.createElement(tag);
                        newElement.innerHTML = blockElement.innerHTML;
                        blockElement.parentNode.replaceChild(newElement, blockElement);
                        
                        // 重新选择内容
                        const newRange = document.createRange();
                        newRange.selectNodeContents(newElement);
                        selection.removeAllRanges();
                        selection.addRange(newRange);
                    } else {
                        // 创建新的块元素
                        const newElement = document.createElement(tag);
                        newElement.textContent = text;
                        
                        range.deleteContents();
                        range.insertNode(newElement);
                        
                        // 如果是空标题，将光标定位到标题内部
                        if (text === '标题') {
                            const newRange = document.createRange();
                            newRange.selectNodeContents(newElement);
                            selection.removeAllRanges();
                            selection.addRange(newRange);
                        }
                    }
                }
                
                this.saveToHistory();
                this.updateAutoSave();
            }
            

            
            clearFormat() {
                if (this.isSourceMode) return;
                
                this.focus();
                const selection = window.getSelection();
                
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    
                    if (!selection.isCollapsed) {
                        // 有选中文本的情况 - 移除选中内容的格式
                        const selectedText = range.toString();
                        
                        // 获取选中文本的完整HTML内容
                        const fragment = range.cloneContents();
                        const plainText = this.extractTextFromFragment(fragment);
                        
                        // 删除原有内容，插入纯文本
                        range.deleteContents();
                        const textNode = document.createTextNode(plainText);
                        range.insertNode(textNode);
                        
                        // 重新选择清除格式后的文本
                        const newRange = document.createRange();
                        newRange.selectNodeContents(textNode);
                        selection.removeAllRanges();
                        selection.addRange(newRange);
                    } else {
                        // 没有选中文本的情况 - 清除当前所在位置的格式
                        const currentNode = range.startContainer;
                        const parentElement = currentNode.nodeType === 3 ? currentNode.parentElement : currentNode;
                        
                        // 查找最近的格式化父元素
                        const formattedParent = this.findFormattedParent(parentElement);
                        if (formattedParent && formattedParent !== this.editorElement) {
                            // 将内容从格式化元素中提取出来，只获取纯文本
                            const content = formattedParent.textContent || formattedParent.innerText || '';
                            const textNode = document.createTextNode(content);
                            
                            // 在格式化元素之前插入纯文本
                            formattedParent.parentNode.insertBefore(textNode, formattedParent);
                            
                            // 删除格式化元素
                            formattedParent.parentNode.removeChild(formattedParent);
                            
                            // 将光标移动到新位置
                            const newRange = document.createRange();
                            newRange.selectNodeContents(textNode);
                            newRange.collapse(false);
                            selection.removeAllRanges();
                            selection.addRange(newRange);
                        }
                    }
                } else {
                    // 没有选中范围的情况 - 清除整个编辑器的格式
                    const content = this.editorElement.textContent || this.editorElement.innerText || '';
                    this.setContent(content);
                }
                
                this.saveToHistory();
                this.updateAutoSave();
            }
            
            // 从DOM片段中提取纯文本
            extractTextFromFragment(fragment) {
                const div = document.createElement('div');
                div.appendChild(fragment);
                return div.textContent || div.innerText || '';
            }
            
            // 查找最近的格式化父元素
            findFormattedParent(element) {
                if (!element || element === this.editorElement) return null;
                
                const formattedTags = ['B', 'I', 'U', 'S', 'STRONG', 'EM', 'MARK', 'SPAN', 'FONT', 'DIV', 'P'];
                const hasFormatStyle = (el) => {
                    if (!el || el === this.editorElement) return false;
                    const style = window.getComputedStyle(el);
                    return style.fontWeight !== '400' || 
                           style.fontStyle !== 'normal' || 
                           style.textDecoration !== 'none' ||
                           style.color !== 'rgb(51, 51, 51)' && style.color !== 'rgb(33, 37, 41)' ||
                           style.backgroundColor !== 'rgba(0, 0, 0, 0)' && style.backgroundColor !== 'rgb(255, 255, 255)';
                };
                
                let current = element;
                while (current && current !== this.editorElement) {
                    if (formattedTags.includes(current.tagName) || hasFormatStyle(current)) {
                        return current;
                    }
                    current = current.parentElement;
                }
                
                return null;
            }
            
            insertLink() {
                if (this.isSourceMode) return;
                
                this.focus();
                const selection = window.getSelection();
                const selectedText = selection.toString() || '链接文本';
                
                const url = prompt('请输入链接地址:', 'https://');
                if (!url) return;
                
                const link = document.createElement('a');
                link.href = url;
                link.textContent = selectedText;
                link.target = '_blank';
                
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    range.deleteContents();
                    range.insertNode(link);
                    
                    range.selectNode(link);
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
                
                this.saveToHistory();
            }
            
            insertImage() {
                if (this.isSourceMode) return;
                
                this.focus();
                const url = prompt('请输入图片地址:', 'https://');
                if (!url) return;
                
                const img = document.createElement('img');
                img.src = url;
                img.alt = '图片';
                img.style.maxWidth = '100%';
                img.style.height = 'auto';
                
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    range.insertNode(img);
                    
                    // 在图片后插入空格
                    const space = document.createTextNode(' ');
                    range.setStartAfter(img);
                    range.setEndAfter(img);
                    range.insertNode(space);
                }
                
                this.saveToHistory();
            }
            
            insertCheckbox() {
                if (this.isSourceMode) return;
                
                this.focus();
                const selection = window.getSelection();
                
                // 创建复选框元素
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.style.marginRight = '8px';
                checkbox.style.cursor = 'pointer';
                
                // 添加点击事件处理
                checkbox.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
                
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    range.insertNode(checkbox);
                    
                    // 在复选框后面插入一个空白文本节点，用户可以输入待办事项
                    const textNode = document.createTextNode(' ');
                    range.setStartAfter(checkbox);
                    range.setEndAfter(checkbox);
                    range.insertNode(textNode);
                    
                    // 将光标移到文本节点后面
                    range.setStartAfter(textNode);
                    range.setEndAfter(textNode);
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
                
                this.saveToHistory();
            }
            
            insertDateTime() {
                if (this.isSourceMode) return;
                
                this.focus();
                const now = new Date();
                
                // 使用标准化的日期时间格式：YYYY-MM-DD HH:MM:SS
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                
                const dateTimeStr = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    const textNode = document.createTextNode(dateTimeStr);
                    range.insertNode(textNode);
                }
                
                this.saveToHistory();
            }
            
            insertHighlight() {
                if (this.isSourceMode) return;
                
                this.focus();
                const selection = window.getSelection();
                
                if (selection.rangeCount > 0 && !selection.isCollapsed) {
                    const range = selection.getRangeAt(0);
                    const selectedText = range.toString();
                    
                    // 创建高亮span
                    const span = document.createElement('span');
                    span.style.backgroundColor = '#ffeb3b';
                    span.style.padding = '2px 4px';
                    span.style.borderRadius = '3px';
                    
                    try {
                        range.surroundContents(span);
                    } catch (e) {
                        const textNode = document.createTextNode(selectedText);
                        range.deleteContents();
                        span.appendChild(textNode);
                        range.insertNode(span);
                    }
                } else {
                    // 如果没有选中文本，插入一个高亮标记，用户可以在里面输入
                    const span = document.createElement('span');
                    span.style.backgroundColor = '#ffeb3b';
                    span.style.padding = '2px 4px';
                    span.style.borderRadius = '3px';
                    span.innerHTML = '&#8203;'; // 零宽空字符
                    
                    const range = selection.getRangeAt(0);
                    range.insertNode(span);
                    
                    // 将光标移到span内部
                    const newRange = document.createRange();
                    newRange.selectNodeContents(span);
                    selection.removeAllRanges();
                    selection.addRange(newRange);
                }
                
                this.saveToHistory();
            }
            
            showSourceMode() {
                const editor = this.editorElement;
                const source = this.sourceElement;
                const richEditor = document.getElementById('richEditor');
              
                
                if (!this.isSourceMode) {
                    source.value = editor.innerHTML;
                    editor.style.display = 'none';
                    source.style.display = 'block';
                    this.autoResizeSource();
                    this.isSourceMode = true;
                    
                    // 隐藏工具栏
                    const toolbar = document.getElementById('editorToolbar');
                    if (toolbar) {
                        toolbar.style.display = 'none';
                    }
                    
                    // 隐藏整个富文本编辑器容器
                    if (richEditor) {
                        richEditor.style.display = 'none';
                    }
                }
                
                // 更新按钮状态
                this.updateModeButtons();
            }
            
            showContentMode() {
                const editor = this.editorElement;
                const source = this.sourceElement;
                const richEditor = document.getElementById('richEditor');
                
                if (this.isSourceMode) {
                    editor.innerHTML = source.value;
                    source.style.display = 'none';
                    editor.style.display = 'block';
                    this.autoResizeContent();
                    this.isSourceMode = false;
                    
                    // 显示工具栏
                    const toolbar = document.getElementById('editorToolbar');
                    if (toolbar) {
                        toolbar.style.display = 'block';
                    }
                    
                    // 显示整个富文本编辑器容器
                    if (richEditor) {
                        richEditor.style.display = 'flex';
                    }
                }
                
                // 更新按钮状态
                this.updateModeButtons();
            }
            
            updateModeButtons() {
                const contentBtn = document.getElementById('contentModeBtn');
                const sourceBtn = document.getElementById('sourceModeBtn');
                
                if (contentBtn && sourceBtn) {
                    if (this.isSourceMode) {
                        // 源代码模式：源代码按钮激活，内容按钮非激活
                        sourceBtn.classList.add('active');
                        contentBtn.classList.remove('active');
                    } else {
                        // 内容模式：内容按钮激活，源代码按钮非激活
                        contentBtn.classList.add('active');
                        sourceBtn.classList.remove('active');
                    }
                }
            }
            
            toggleSourceMode() {
                // 保留原有方法以兼容其他调用
                if (this.isSourceMode) {
                    this.showContentMode();
                } else {
                    this.showSourceMode();
                }
            }
            

            
            toggleHeadingDropdown(event) {
                this.toggleDropdown('headingDropdown', event);
            }
            

            
            getBlockElement(range) {
                let node = range.commonAncestorContainer;
                if (node.nodeType === 3) {
                    node = node.parentElement;
                }
                
                while (node && node !== this.editorElement) {
                    if (['P', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'DIV', 'LI'].includes(node.tagName)) {
                        return node;
                    }
                    node = node.parentElement;
                }
                
                return null;
            }
            
            // 检查选区是否包含指定标签
            hasTagInRange(range, tagName) {
                try {
                    const selection = window.getSelection();
                    if (selection.rangeCount === 0) return false;
                    
                    const currentRange = range || selection.getRangeAt(0);
                    let node = currentRange.commonAncestorContainer;
                    
                    // 如果是文本节点，检查其父元素
                    if (node.nodeType === 3) {
                        node = node.parentElement;
                    }
                    
                    // 向上查找到编辑器根元素
                    while (node && node !== this.editorElement) {
                        if (node.tagName === tagName) {
                            return true;
                        }
                        node = node.parentElement;
                    }
                    
                    // 检查选区内的所有节点
                    const nodes = currentRange.cloneContents();
                    const elements = nodes.querySelectorAll(tagName);
                    return elements.length > 0;
                    
                } catch (error) {
                    console.error(`检查标签状态失败 (${tagName}):`, error);
                    return false;
                }
            }
            
            // 检查光标是否在指定类型的列表内
            isInsideList(range, listType) {
                try {
                    let node = range.commonAncestorContainer;
                    
                    // 如果是文本节点，检查其父元素
                    if (node.nodeType === 3) {
                        node = node.parentElement;
                    }
                    
                    // 向上查找到编辑器根元素
                    while (node && node !== this.editorElement) {
                        if (node.tagName === listType) {
                            return true;
                        }
                        node = node.parentElement;
                    }
                    
                    return false;
                } catch (error) {
                    console.error(`检查列表状态失败 (${listType}):`, error);
                    return false;
                }
            }
            
            handlePaste(e) {
                e.preventDefault();
                const text = e.clipboardData.getData('text/plain') || '';
                const selection = window.getSelection();
                
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    range.deleteContents();
                    range.insertNode(document.createTextNode(text));
                }
                
                this.saveToHistory();
            }
       
            focus() {
                if (!this.isSourceMode) {
                    this.editorElement.focus();
                    
                    // 如果没有选区，将光标设置到编辑器末尾
                    const selection = window.getSelection();
                    if (selection.rangeCount === 0) {
                        const range = document.createRange();
                        range.selectNodeContents(this.editorElement);
                        range.collapse(false); // false表示折叠到末尾
                        selection.removeAllRanges();
                        selection.addRange(range);
                    }
                } else {
                    this.sourceElement.focus();
                }
            }
            
            getContent() {
                if (this.isSourceMode) {
                    return this.sourceElement.value;
                } else {
                    return this.editorElement.innerHTML;
                }
            }
            
            setContent(content) {
                if (this.isSourceMode) {
                    this.sourceElement.value = content;
                    this.autoResizeSource();
                } else {
                    this.editorElement.innerHTML = content;
                    this.autoResizeContent();
                }
            }
            
            updateToolbarState() {
                if (this.isSourceMode) return;
                
                // 更新工具栏按钮的激活状态（参考notes.html实现）
                const toolbarBtns = this.toolbarElement.querySelectorAll('.editor-btn');
                
                // 更新按钮状态
                toolbarBtns.forEach(btn => {
                    const command = btn.getAttribute('onclick')?.match(/editor\.format\('([^']+)'\)/);
                    if (command && command[1]) {
                        const cmd = command[1];
                        let isActive = false;
                        
                        // 使用现代方法检查格式状态
                        const selection = window.getSelection();
                        if (selection.rangeCount > 0) {
                            const range = selection.getRangeAt(0);
                            const parentElement = range.commonAncestorContainer.nodeType === 3 ? 
                                range.commonAncestorContainer.parentElement : 
                                range.commonAncestorContainer;
                            
                            if (['bold', 'italic', 'underline', 'strikeThrough'].includes(cmd)) {
                                const tagName = cmd === 'bold' ? 'B' : 
                                              cmd === 'italic' ? 'I' : 
                                              cmd === 'underline' ? 'U' : 'S';
                                isActive = this.hasTagInRange(range, tagName);
                            } else if (['justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'].includes(cmd)) {
                                const blockElement = this.getBlockElement(range);
                                if (blockElement) {
                                    const align = blockElement.style.textAlign || 'left';
                                    const expectedAlign = cmd.replace('justify', '').toLowerCase();
                                    isActive = align === expectedAlign;
                                }
                            } else if (['insertUnorderedList', 'insertOrderedList'].includes(cmd)) {
                                const listType = cmd === 'insertUnorderedList' ? 'UL' : 'OL';
                                isActive = this.hasTagInRange(range, listType) || this.isInsideList(range, listType);
                            }
                        }
                        
                        // 如果现代方法失败，回退到queryCommandState
                        if (typeof isActive === 'undefined' || isActive === false) {
                            try {
                                isActive = document.queryCommandState(cmd);
                            } catch (e) {
                                // 忽略queryCommandState错误
                            }
                        }
                        
                        btn.classList.toggle('active', isActive);
                    }
                });
                
                // 更新下拉框状态
                const selects = this.toolbarElement.querySelectorAll('.toolbar-select');
                selects.forEach(select => {
                    const command = select.dataset.command;
                    if (command === 'fontName') {
                        // 字体选择框状态更新
                        const font = document.queryCommandValue('fontName');
                        if (font) {
                            const fontOption = Array.from(select.options).find(option => 
                                option.value === font || option.text === font
                            );
                            if (fontOption) {
                                select.value = fontOption.value;
                            }
                        }
                    } else if (command === 'fontSize') {
                        // 字体大小状态更新
                        const selection = window.getSelection();
                        if (selection.rangeCount > 0) {
                            const range = selection.getRangeAt(0);
                            const parentElement = range.commonAncestorContainer.nodeType === 3 ? 
                                range.commonAncestorContainer.parentElement : 
                                range.commonAncestorContainer;
                            
                            if (parentElement && parentElement.style.fontSize) {
                                const size = parentElement.style.fontSize;
                                const sizeOption = Array.from(select.options).find(option => 
                                    option.value === size
                                );
                                if (sizeOption) {
                                    select.value = sizeOption.value;
                                }
                            }
                        }
                    }
                });
                
                // 更新颜色选择器状态
                const colorInput = this.toolbarElement.querySelector('.toolbar-color');
                if (colorInput) {
                    try {
                        const textColor = document.queryCommandValue('foreColor');
                        if (textColor && textColor !== '') {
                            // 将RGB颜色转换为HEX格式
                            const hexColor = this.rgbToHex(textColor);
                            colorInput.value = hexColor;
                        }
                    } catch (e) {
                        // 忽略查询颜色时的错误
                    }
                }
                
                // 更新背景颜色选择器状态
                const bgColorInput = this.toolbarElement.querySelector('.toolbar-bg-color');
                if (bgColorInput) {
                    try {
                        const bgColor = document.queryCommandValue('backColor');
                        if (bgColor && bgColor !== '') {
                            // 将RGB颜色转换为HEX格式
                            const hexColor = this.rgbToHex(bgColor);
                            bgColorInput.value = hexColor;
                        }
                    } catch (e) {
                        // 忽略查询颜色时的错误
                    }
                }
            }
            
            updateAutoSave() {
                const currentContent = this.getContent();
                if (currentContent === this.lastContent) return;
                
                this.lastContent = currentContent;
                
                // 触发自动保存
                const autoSaveToggle = document.getElementById('autoSaveToggle');
                if (autoSaveToggle && autoSaveToggle.checked) {
                    this.showAutoSaveIndicator();
                    if (typeof autoSaveNote === 'function') {
                        autoSaveNote();
                    }
                }
            }
            
            showAutoSaveIndicator() {
                if (this.autoSaveIndicator) {
                    this.autoSaveIndicator.classList.add('show');
                    setTimeout(() => {
                        this.autoSaveIndicator.classList.remove('show');
                    }, 2000);
                }
            }
            

            
            // 插入引用
            insertQuote() {
                if (this.isSourceMode) return;
                
                this.focus();
                const selection = window.getSelection();
                const selectedText = selection.toString() || '引用内容';
                
                const blockquote = document.createElement('blockquote');
                blockquote.textContent = selectedText;
                blockquote.style.borderLeft = '4px solid #667eea';
                blockquote.style.paddingLeft = '20px';
                blockquote.style.margin = '10px 0';
                blockquote.style.fontStyle = 'italic';
                blockquote.style.color = '#64748b';
                blockquote.style.backgroundColor = '#f8fafc';
                blockquote.style.borderRadius = '0 8px 8px 0';
                
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    range.deleteContents();
                    range.insertNode(blockquote);
                    
                    // 在引用后添加换行
                    const br = document.createElement('br');
                    range.setStartAfter(blockquote);
                    range.setEndAfter(blockquote);
                    range.insertNode(br);
                    
                    // 选择引用内容
                    range.selectNodeContents(blockquote);
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
                
                this.saveToHistory();
            }
            
            // 插入代码块
            insertCode() {
                if (this.isSourceMode) return;
                
                this.focus();
                const selection = window.getSelection();
                const selectedText = selection.toString() || '代码内容';
                
                const pre = document.createElement('pre');
                pre.style.background = '#f8fafc';
                pre.style.padding = '15px';
                pre.style.borderRadius = '8px';
                pre.style.overflowX = 'auto';
                pre.style.fontFamily = 'Courier New, monospace';
                pre.style.fontSize = '14px';
                pre.style.border = '1px solid #e2e8f0';
                pre.style.margin = '10px 0';
                
                const code = document.createElement('code');
                code.textContent = selectedText;
                pre.appendChild(code);
                
                if (selection.rangeCount > 0) {
                    const range = selection.getRangeAt(0);
                    range.deleteContents();
                    range.insertNode(pre);
                    
                    // 在代码块后添加换行
                    const br = document.createElement('br');
                    range.setStartAfter(pre);
                    range.setEndAfter(pre);
                    range.insertNode(br);
                    
                    // 选择代码内容
                    range.selectNodeContents(code);
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
                
                this.saveToHistory();
            }
            
            // 插入水平线
            insertHR() {
                if (this.isSourceMode) return;
                
                this.focus();
                
                try {
                    document.execCommand('insertHorizontalRule', false, null);
                    
                    // 在水平线前后添加换行以确保格式正确
                    const selection = window.getSelection();
                    if (selection.rangeCount > 0) {
                        const range = selection.getRangeAt(0);
                        const hr = range.commonAncestorContainer.querySelector('hr');
                        if (hr) {
                            const brBefore = document.createElement('br');
                            const brAfter = document.createElement('br');
                            hr.parentNode.insertBefore(brBefore, hr);
                            hr.parentNode.insertBefore(brAfter, hr.nextSibling);
                            
                            // 将光标移到水平线后面
                            range.setStartAfter(brAfter);
                            range.setEndAfter(brAfter);
                            selection.removeAllRanges();
                            selection.addRange(range);
                        }
                    }
                    
                    this.saveToHistory();
                } catch (error) {
                    console.error('插入水平线失败:', error);
                }
            }
            
            // RGB颜色转换为HEX格式
            rgbToHex(rgb) {
                if (rgb.startsWith('#')) {
                    return rgb; // 已经是HEX格式
                }
                
                // 处理rgb(r, g, b)格式
                const rgbMatch = rgb.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
                if (rgbMatch) {
                    const r = parseInt(rgbMatch[1]);
                    const g = parseInt(rgbMatch[2]);
                    const b = parseInt(rgbMatch[3]);
                    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
                }
                
                // 处理其他格式，返回默认值
                return '#000000';
            }

        }

        // 按颜色筛选便签
        function filterNotesByColor(color) {
            // 先获取所有便签
            let allNotes = notes;
            
            // 如果当前有搜索查询，先进行搜索过滤
            if (searchQuery) {
                allNotes = allNotes.filter(note => {
                    const title = (note.title || '').toLowerCase();
                    const content = (note.content || '').toLowerCase();
                    const plainContent = content.replace(/<[^>]*>/g, '');
                    return title.includes(searchQuery) || plainContent.includes(searchQuery);
                });
            }
            
            // 再进行颜色过滤
            const filteredNotes = color === 'all' ? allNotes : allNotes.filter(note => {
                // 对于'none'颜色，只匹配没有颜色或颜色为'none'的便签
                if (color === 'none') {
                    return !note.color || note.color === 'none';
                }
                // 对于其他颜色，匹配颜色属性或默认黄色
                return (note.color || 'yellow') === color;
            });
            
            // 直接渲染筛选后的结果
            const notesList = document.getElementById('notesList');
            
            if (filteredNotes.length === 0) {
                if (color !== 'all') {
                    notesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-filter"></i>
                            <div class="empty-state-text">没有找到${getColorName(color)}便签</div>
                            <div style="color: #999; font-size: 14px;">试试其他颜色或显示全部</div>
                        </div>
                    `;
                } else {
                    notesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-search"></i>
                            <div class="empty-state-text">没有找到匹配的便签</div>
                            <div style="color: #999; font-size: 14px;">请尝试其他搜索词</div>
                        </div>
                    `;
                }
            } else {
                // 按时间排序并渲染
                const sortedNotes = filteredNotes.sort((a, b) => {
                    // 置顶的便签优先
                    if (a.is_pinned && !b.is_pinned) return -1;
                    if (!a.is_pinned && b.is_pinned) return 1;
                    
                    // 然后按时间排序
                    const dateA = a.updated_at ? new Date(a.updated_at) : new Date(0);
                    const dateB = b.updated_at ? new Date(b.updated_at) : new Date(0);
                    return dateB - dateA;
                });
                
                notesList.innerHTML = sortedNotes.map(note => {
                        const color = note.color || 'none';
                        const isPinned = note.is_pinned || false;
                        const displayContent = note.content ? processNoteContent(note.content) : '';
                        const wordCount = getWordCount(note.content || '');
                    return `
                        <div class="note-item ${color} ${isPinned ? 'pinned' : ''}" onclick="openEditNoteModal(${note.id || 0})">
                            <div class="note-actions">
                                <button class="note-action-btn pin" onclick="event.stopPropagation(); togglePin(${note.id || 0})" title="${isPinned ? '取消置顶' : '置顶'}">
                                    <i class="fas fa-thumbtack"></i>
                                </button>
                                <button class="note-action-btn copy" onclick="event.stopPropagation(); copyNote(${note.id || 0})" title="复制">
                                    <i class="fas fa-copy"></i>
                                </button>
                                <button class="note-action-btn delete" onclick="event.stopPropagation(); quickDeleteNote(${note.id || 0})" title="删除">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                            <div class="note-title"><i class="fas fa-sticky-note" style="margin-right: 5px;"></i>${note.title || '无标题'}</div>
                            <div class="note-content">${displayContent}</div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; flex-shrink: 0;">
                                <div class="note-word-count">${wordCount}字</div>
                                <div class="note-date">${formatDate(note.updated_at || note.created_at)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

            try {
                const newPinState = !note.is_pinned;
                const response = await fetch(`/api/notes/${noteId}/pin`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${Utils.getToken()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ is_pinned: newPinState })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        note.is_pinned = newPinState;
                        Utils.showSuccess(newPinState ? '便签已置顶' : '已取消置顶');
                        // 重新渲染便签列表
                        filterNotesByColor(selectedColor || 'all');
                    }
                }
            } catch (error) {
                console.error('置顶操作失败:', error);
                Utils.showError('操作失败');
            }

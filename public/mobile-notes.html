        // 自动保存便签
        async function autoSaveNote() {
            if (!isEditing) return;
            
            // 检查自动保存复选框是否选中
            const autoSaveToggle = document.getElementById('autoSaveToggle');
            if (autoSaveToggle && !autoSaveToggle.checked) return;
            
            const title = document.getElementById('noteTitle').value.trim();
            let content = '';
            
            if (editor) {
                content = editor.getContent().trim();
            }
            
            // 检查内容是否有变化
            const currentContent = `${title}|${content}`;
            if (currentContent === lastSavedContent) return;
            
            // 如果标题和内容都为空，不进行保存
            if (!title && !content) return;
            
            try {
                const isPinned = document.getElementById('isPinned').checked;
                const noteData = { 
                    title, 
                    content,
                    color: currentNoteColor,
                    is_pinned: isPinned
                };
                let response;
                
                if (currentNoteId) {
                    // 更新现有便签
                    response = await fetch(`/api/notes/${currentNoteId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${Utils.getToken()}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(noteData)
                    });
                } else {
                    // 创建新便签
                    response = await fetch('/api/notes', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${Utils.getToken()}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(noteData)
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        if (result.success && result.data && result.data.id) {
                            // 获取新创建的便签ID
                            currentNoteId = result.data.id;
                            // 更新删除按钮显示
                            document.getElementById('deleteNoteBtn').style.display = 'inline-block';
                        }
                    }
                }
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        lastSavedContent = currentContent;
                        // 只更新当前编辑的卡片，不刷新整个列表
                        if (currentNoteId) {
                            // 更新本地notes数组中的数据
                            const noteIndex = notes.findIndex(note => note.id === currentNoteId);
                            if (noteIndex !== -1) {
                                notes[noteIndex].title = title || '无标题';
                                notes[noteIndex].content = content || '无内容';
                                notes[noteIndex].updated_at = new Date().toISOString();
                            }
                            
                            // 更新列表中的卡片元素
                            const noteItems = document.querySelectorAll('.note-item');
                            noteItems.forEach(item => {
                                // 找到与currentNoteId匹配的卡片
                                if (item.getAttribute('onclick') === `openEditNoteModal(${currentNoteId})`) {
                                    item.querySelector('.note-title').textContent = title || '无标题';
                                    item.querySelector('.note-content').innerHTML = content || '无内容';
                                    item.querySelector('.note-date').innerHTML = `<i class="fas fa-clock"></i> ${formatDate(new Date().toISOString())}`;
                                }
                            });
                        }
                        console.log('自动保存成功');
                    }
                }
            } catch (error) {
                console.error('自动保存失败:', error);
            }
        }

        async function saveNote() {
            const titleInput = document.getElementById('noteTitle');
            const title = titleInput.value.trim();
            let content = '';
            
            // 获取便签内容
            if (editor) {
                content = editor.getContent().trim();
            }
            
            // 清除之前的错误样式
            titleInput.classList.remove('input-error');
            
            // 表单验证
            if (!title) {
                titleInput.classList.add('input-error');
                Utils.showError('请填写便签标题');
                titleInput.focus();
                return;
            }
            
            if (!content) {
                Utils.showError('请填写便签内容');
                if (editor) {
                    editor.focus();
                }
                return;
            }
            
            // 获取保存按钮并禁用，防止多次点击
            const saveBtn = document.getElementById('saveNoteBtn');
            const icon = saveBtn.querySelector('i');
            const originalIcon = icon.className;
            saveBtn.disabled = true;
            // 显示加载状态
            icon.className = 'fas fa-spinner fa-spin';
            
            try {
                let response;
                const isPinned = document.getElementById('isPinned').checked;
                const noteData = { 
                    title, 
                    content,
                    color: currentNoteColor,
                    is_pinned: isPinned
                };
                
                if (currentNoteId) {
                    // 编辑现有便签
                    response = await fetch(`/api/notes/${currentNoteId}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${Utils.getToken()}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(noteData)
                    });
                } else {
                    // 添加新便签
                    response = await fetch('/api/notes', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${Utils.getToken()}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(noteData)
                    });
                }
                
                if (!response.ok) {
                    throw new Error(currentNoteId ? '更新便签失败' : '添加便签失败');
                }
                
                const result = await response.json();
                if (result.success) {
                    // 重新加载便签数据
                    await loadNotes();
                    
                    
                    // 关闭模态框
                    closeNoteModal();
                    
                    Utils.showSuccess(result.message || (currentNoteId ? '便签更新成功' : '便签添加成功'));
                    
                } else {
                    throw new Error(result.message || (currentNoteId ? '更新便签失败' : '添加便签失败'));
                }
            } catch (error) {
                console.error('保存便签失败:', error);
                Utils.showError(error.message || '保存便签失败');
            } finally {
                // 无论成功还是失败，都重新启用保存按钮并恢复原始图标
                saveBtn.disabled = false;
                icon.className = originalIcon;
            }
        }
        
        // 删除便签
        async function deleteNote() {
            if (currentNoteId) {
                Utils.confirm('删除便签', '确定要删除这个便签吗？', async () => {
                    try {
                        const response = await fetch(`/api/notes/${currentNoteId}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `Bearer ${Utils.getToken()}`,
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        if (!response.ok) {
                            throw new Error('删除便签失败');
                        }
                        
                        const result = await response.json();
                        if (result.success) {
                            // 重新加载便签数据
                            await loadNotes();
                            
                            
                            // 关闭模态框
                            closeNoteModal();
                            
                            Utils.showSuccess(result.message || '便签删除成功');
                        } else {
                            throw new Error(result.message || '删除便签失败');
                        }
                    } catch (error) {
                        console.error('删除便签失败:', error);
                        Utils.showError(error.message || '删除便签失败');
                    }
                });
            }
        }
        
        // 将文本中的URL转换为可点击的链接
        function convertLinksToHtml(text) {
            if (!text) return '';
            
            // URL正则表达式 - 支持IPv4、域名和IPv6
            // IPv6格式: http://[240e:3b2:6620:2690:7832:9dce:ca10:33df]:3004
            const urlRegex = /((?:https?:\/\/)?(?:(?:\[[0-9a-fA-F:]+\])|(?:[a-zA-Z0-9-]+\.)+(?:com|cn|net|org|edu|gov|io|co|me|cc|tv|info|xyz|top|wang|ren|vip|site|online|shop|club|web|cloud|fun|press|space|live|work|zone|market|store|biz))(?::\d+)?(?:\/[^\s<]*)?)/gi;
            
            // 将URL替换为可点击的链接
            const html = text.replace(urlRegex, function(url) {
                // 确保URL有http://前缀
                const fullUrl = url.startsWith('http') ? url : 'http://' + url;
                // 如果URL太长，截取显示
                const displayUrl = url.length > 40 ? url.substring(0, 40) + '...' : url;
                return `<a href="${fullUrl}" target="_blank" class="note-link" onclick="event.stopPropagation();">${displayUrl}</a>`;
            });
            
            return html;
        }
        
        // 处理便签内容：保持HTML格式并将纯文本URL转换为可点击链接
        function processNoteContent(content) {
            if (!content) return '';
            
            // 先将已有的a标签标记为已处理（使用占位符）
            const processedAnchors = [];
            let tempContent = content.replace(/<a\b[^>]*>.*?<\/a>/gi, function(match) {
                const placeholder = `__ANCHOR_${processedAnchors.length}__`;
                // 确保链接在新窗口打开并添加样式
                const enhancedLink = match.replace(/<a\b/, '<a target="_blank" class="note-link" onclick="event.stopPropagation();"');
                processedAnchors.push(enhancedLink);
                return placeholder;
            });
            
            // 将纯文本URL转换为链接
            const urlRegex = /((?:https?:\/\/)?(?:(?:\[[0-9a-fA-F:]+\])|(?:[a-zA-Z0-9-]+\.)+(?:com|cn|net|org|edu|gov|io|co|me|cc|tv|info|xyz|top|wang|ren|vip|site|online|shop|club|web|cloud|fun|press|space|live|work|zone|market|store|biz))(?::\d+)?(?:\/[^\s<]*)?)/gi;
            tempContent = tempContent.replace(urlRegex, function(url) {
                const fullUrl = url.startsWith('http') ? url : 'http://' + url;
                return `<a href="${fullUrl}" target="_blank" class="note-link" onclick="event.stopPropagation();">${url}</a>`;
            });
            
            // 还原a标签占位符
            processedAnchors.forEach((link, index) => {
                tempContent = tempContent.replace(`__ANCHOR_${index}__`, link);
            });
            
            return tempContent;
        }
        
        // 计算字数（简化版本）
        function getWordCount(content) {
            if (!content) return 0;
            
            // 移除HTML标签，只保留纯文本
            const textContent = content.replace(/<[^>]*>/g, '');
            
            // 移除空格和换行符，只计算实际字符
            const cleanText = textContent.replace(/\s+/g, '');
            
            // 返回字符数（包括中文、英文、数字、标点符号）
            return cleanText.length;
        }
        
        // 格式化日期（添加相对时间显示）
        function formatDate(dateString) {
            if (!dateString) return '';
            
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return '';
            
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            // 今天的时间只显示时分
            if (diffDays === 0) {
                return date.toLocaleTimeString('zh-CN', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            }
            // 昨天的时间显示"昨天 时分"
            else if (diffDays === 1) {
                return `昨天 ${date.toLocaleTimeString('zh-CN', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                })}`;
            }
            // 最近7天的时间显示星期和时分
            else if (diffDays < 7) {
                const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                return `${weekdays[date.getDay()]} ${date.toLocaleTimeString('zh-CN', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                })}`;
            }
            // 今年的时间显示月日和时分
            else if (date.getFullYear() === now.getFullYear()) {
                return date.toLocaleString('zh-CN', { 
                    month: '2-digit', 
                    day: '2-digit', 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            }
            // 其他年份显示完整日期和时间
            else {
                return date.toLocaleString('zh-CN', { 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit', 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
            }
        }
        
        // 搜索便签
        function searchNotes() {
            searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const clearSearchBtn = document.getElementById('clearSearchBtn');
            
            // 显示/隐藏清除按钮
            if (searchQuery) {
                clearSearchBtn.style.display = 'inline-block';
            } else {
                clearSearchBtn.style.display = 'none';
            }
            
            // 应用当前的颜色筛选
            filterNotesByColor(selectedColor);
        }
        

        
        // 清除搜索
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            
            // 应用当前的颜色筛选
            filterNotesByColor(selectedColor);
        }
        
        // 点击模态框外部关闭模态框
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('noteModal');
            if (event.target === modal) {
                closeNoteModal();
            }
        });
        
        // 滚动优化功能
        const notesList = document.getElementById('notesList');
        let scrollPosition = 0;
        
        // 保存滚动位置
        function saveScrollPosition() {
            scrollPosition = notesList.scrollTop;
        }
        
        // 恢复滚动位置
        function restoreScrollPosition() {
            if (scrollPosition > 0) {
                notesList.scrollTop = scrollPosition;
            }
        }
        
        // 滚动到顶部
        function scrollToTop() {
            notesList.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
        
        // 滚动到底部
        function scrollToBottom() {
            notesList.scrollTo({
                top: notesList.scrollHeight,
                behavior: 'smooth'
            });
        }
        
        // 检测滚动到底部（可用于无限滚动）
        function isScrolledToBottom() {
            return notesList.scrollTop + notesList.clientHeight >= notesList.scrollHeight - 50;
        }
        
        // 滚动事件监听
        notesList.addEventListener('scroll', function() {
            // 可以在这里添加无限滚动功能
            if (isScrolledToBottom()) {
                console.log('已滚动到底部');
                // loadMoreNotes();
            }
        });
                
        // 切换快捷键帮助显示
        function toggleShortcutsHelp() {
            const helpOverlay = document.getElementById('helpOverlay');
            const shortcutsHelp = document.getElementById('shortcutsHelp');
            
            helpOverlay.classList.toggle('show');
            shortcutsHelp.classList.toggle('show');
        }
        

        
        // 初始化置顶复选框
        function setupPinCheckbox() {
            const pinCheckbox = document.getElementById('isPinned');
            const pinLabel = document.querySelector('.pin-toggle-label');
            
            if (pinCheckbox && pinLabel) {
                // 初始化状态
                updatePinVisualState(pinCheckbox.checked);
                
                // 监听复选框变化
                pinCheckbox.addEventListener('change', function() {
                    updatePinVisualState(this.checked);
                });
            }
        }
        
        // 初始化自动保存复选框
        function setupAutoSaveCheckbox() {
            const autoSaveCheckbox = document.getElementById('autoSaveToggle');
            const autoSaveLabel = document.querySelector('.auto-save-toggle-label');
            
            if (autoSaveCheckbox && autoSaveLabel) {
                // 初始化状态
                updateAutoSaveVisualState(autoSaveCheckbox.checked);
                
                // 监听复选框变化
                autoSaveCheckbox.addEventListener('change', function() {
                    updateAutoSaveVisualState(this.checked);
                });
            }
        }
        
        // 更新置顶视觉状态
        function updatePinVisualState(isPinned) {
            const pinLabel = document.querySelector('.pin-toggle-label');
            const pinIcon = pinLabel?.querySelector('i');
            const pinText = pinLabel?.querySelector('span');
            
            if (pinLabel) {
                if (isPinned) {
                    pinLabel.classList.add('active');
                    if (pinIcon) {
                        pinIcon.style.color = '#ff9800';
                        pinIcon.style.transform = 'rotate(45deg)';
                    }
                    if (pinText) {
                        pinText.style.color = '#ff9800';
                        pinText.style.fontWeight = '500';
                    }
                } else {
                    pinLabel.classList.remove('active');
                    if (pinIcon) {
                        pinIcon.style.color = '#666';
                        pinIcon.style.transform = 'rotate(0deg)';
                    }
                    if (pinText) {
                        pinText.style.color = '#666';
                        pinText.style.fontWeight = 'normal';
                    }
                }
            }
        }
        
        // 更新自动保存视觉状态
        function updateAutoSaveVisualState(isAutoSave) {
            const autoSaveLabel = document.querySelector('.auto-save-toggle-label');
            const autoSaveIcon = autoSaveLabel?.querySelector('i');
            const autoSaveText = autoSaveLabel?.querySelector('span');
            
            if (autoSaveLabel) {
                if (isAutoSave) {
                    autoSaveLabel.classList.add('active');
                    if (autoSaveIcon) {
                        autoSaveIcon.style.color = '#28a745';
                    }
                    if (autoSaveText) {
                        autoSaveText.style.color = '#28a745';
                        autoSaveText.style.fontWeight = '500';
                    }
                } else {
                    autoSaveLabel.classList.remove('active');
                    if (autoSaveIcon) {
                        autoSaveIcon.style.color = '#666';
                    }
                    if (autoSaveText) {
                        autoSaveText.style.color = '#666';
                        autoSaveText.style.fontWeight = 'normal';
                    }
                }
            }
        }
        
        // 添加触摸滚动支持（移动端优化）
        let touchStartY = 0;
        let touchEndY = 0;
        
        notesList.addEventListener('touchstart', function(e) {
            touchStartY = e.changedTouches[0].screenY;
        });
        
        notesList.addEventListener('touchend', function(e) {
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeDistance = touchStartY - touchEndY;
            const minSwipeDistance = 50;
            
            if (Math.abs(swipeDistance) > minSwipeDistance) {
                if (swipeDistance > 0) {
                    // 向上滑动
                    console.log('向上滑动');
                } else {
                    // 向下滑动
                    console.log('向下滑动');
                }
            }
        }
    </script>

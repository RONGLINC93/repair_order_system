<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>安全设置 - 移动端</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1">
    <link rel="stylesheet" href="/css/mobile-style.css">
    <link rel="stylesheet" href="/fontawesome-free-6.6.0-web/css/all.min.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="mobile-header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
                <span class="unread-badge" id="menuChatBadge" style="display: none;"></span>
            </button>
            <button class="menu-btn" onclick="Utils.goBackWithRefresh()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="app-title">安全设置</h1>
        </div>
        <div class="header-right">
            <div class="notification-icon" onclick="window.location.href='/mobile-notifications.html'">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" id="mobileNotificationBadge">0</span>
            </div>
        </div>
    </header>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="user-info">
                <div class="user-avatar" id="sidebarAvatar" onclick="window.location.href='/mobile-profile.html'">
                    <i class="fas fa-user" id="sidebarAvatarIcon"></i>
                    <img id="sidebarAvatarImage" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" alt="用户头像">
                </div>
                <div class="user-details">
                    <div class="user-name" id="mobileUserName">用户</div>
                    <div class="user-role" id="mobileUserRole">角色</div>
                </div>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="/mobile-index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </a>
            <a href="/mobile-my-orders.html" class="nav-item" id="myOrdersLink">
                <i class="fas fa-tasks"></i>
                <span>我的工单</span>
            </a>
            <a href="/mobile-orders.html" class="nav-item">
                <i class="fas fa-list"></i>
                <span>所有工单</span>
            </a>
            <a href="/mobile-material-requests.html" class="nav-item" id="materialRequestsLink">
                <i class="fas fa-box"></i>
                <span>物料管理</span>
            </a>
            <a href="/mobile-chat.html" class="nav-item" id="chatLink">
                <i class="fas fa-comment"></i>
                <span>内部聊天</span>
                <span class="unread-badge" id="unreadChatCount" style="display: none;"></span>
            </a>
            
            
            <a href="/mobile-admin.html" class="nav-item" id="adminLink" style="display: none;">
                <i class="fas fa-cogs"></i>
                <span>系统管理</span>
            </a>
                        
            <a href="/mobile-app-center.html" class="nav-item">
                <i class="fas fa-th"></i>
                <span>应用中心</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            
            <a href="/mobile-settings.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>设置</span>
            </a>
<a href="/mobile-about.html" class="nav-item" id="aboutLink">
                <i class="fas fa-info-circle"></i>
                <span>关于系统</span>
            </a>
            <a href="#" class="nav-item logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>退出登录</span>
            </a>
        </div>
    </aside>
  <!-- 侧边栏遮罩层 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 主内容区 -->
    <main class="main-content" style="margin-top: 60px;">
        <div class="content-scroll password-page">
            <div class="orders-section">
                <!-- 密码修改卡片 -->
                <div class="order-card">
                    <div class="card-header" style="padding-bottom: 10px;">
                        <h3>
                            <i class="fas fa-key" style="color: #667eea;"></i>
                            修改密码
                        </h3>
                    </div>
                   
                        <form id="passwordForm" >
                            <div class="form-group">
                                <label for="currentPassword" class="form-label">
                                    <i class="fas fa-lock"></i>
                                    当前密码 *
                                </label>
                                <input type="password" id="currentPassword" name="currentPassword" class="form-control" required>
                                <small class="text-muted">请输入您当前使用的密码</small>
                            </div>
                            
                            <div class="form-group">
                                <label for="newPassword" class="form-label">
                                    <i class="fas fa-key"></i>
                                    新密码 *
                                </label>
                                <input type="password" id="newPassword" name="newPassword" class="form-control" required minlength="6">
                                <small class="text-muted">密码至少需要6位字符</small>
                                <div class="password-strength" id="passwordStrength">
                                    <div class="strength-bar">
                                        <div class="strength-fill" id="strengthFill"></div>
                                    </div>
                                    <span class="strength-text" id="strengthText">密码强度</span>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="confirmPassword" class="form-label">
                                    <i class="fas fa-check-circle"></i>
                                    确认新密码 *
                                </label>
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                                <small class="text-muted">请再次输入新密码确认</small>
                            </div>

                            <!-- 安全提示 -->
                            <div class="security-tips">
                                <h4>
                                    <i class="fas fa-shield-alt"></i>
                                    安全提示
                                </h4>
                                <ul>
                                    <li>使用包含大小写字母、数字和特殊字符的复杂密码</li>
                                    <li>不要使用个人信息作为密码</li>
                                    <li>定期更换密码，确保账户安全</li>
                                    <li>不要在公共场所保存密码</li>
                                </ul>
                            </div>
                            
                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary" onclick="if (document.referrer) { window.location.href = document.referrer + (document.referrer.includes('?') ? '&' : '?') + 't=' + new Date().getTime(); } else { window.history.back(); }">
                                    <i class="fas fa-times"></i>
                                    取消
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i>
                                    修改密码
                                </button>
                            </div>
                        </form>
                  
                </div>

                <!-- 密码历史记录 -->
                <div class="order-card" style="margin-top: 20px;">
                    <div class="card-header">
                        <h3>
                            <i class="fas fa-history"></i>
                            最近修改记录
                        </h3>
                    </div>
                    <div class="card-body">
                        <div id="passwordHistory">
                            <!-- 加载动画 -->
                            <div class="loading-spinner">
                                <i class="fas fa-spinner fa-spin"></i>
                                <span>加载中...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 账户安全状态 -->
                <div class="order-card" style="margin-top: 20px;">
                    <div class="card-header">
                        <h3>
                            <i class="fas fa-shield-alt"></i>
                            账户安全状态
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="security-status">
                            <div class="status-item">
                                <div class="status-icon success">
                                    <i class="fas fa-check"></i>
                                </div>
                                <div class="status-content">
                                    <h4>密码保护</h4>
                                    <p>您的账户已设置密码</p>
                                </div>
                            </div>
                            <div class="status-item">
                                <div class="status-icon warning" id="passwordAgeStatus">
                                    <i class="fas fa-exclamation-triangle"></i>
                                </div>
                                <div class="status-content">
                                    <h4>密码更新时间</h4>
                                    <p id="passwordAgeText">检查中...</p>
                                </div>
                            </div>
                            <div class="status-item">
                                <div class="status-icon success">
                                    <i class="fas fa-lock"></i>
                                </div>
                                <div class="status-content">
                                    <h4>连接安全</h4>
                                    <p>当前连接使用HTTPS加密</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/utils.js"></script>
    <script>
        let currentUser = null;

        // 页面初始化
        document.addEventListener('DOMContentLoaded', async function() {
            await checkAuth();
            setupNavigation();
            setupFormHandlers();
            await loadPasswordHistory();
            checkPasswordAge();
        });

        // 检查权限
        async function checkAuth() {
            const user = Utils.getUser();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }

            const userName = user.fullName || user.username;
            const userPosition = Utils.getAccountTypeText(user.accountType);
            document.getElementById('mobileUserName').textContent = userName;
            document.getElementById('mobileUserRole').textContent = userPosition;
            currentUser = user;
                   // 加载侧边栏头像
            await loadSidebarAvatar();
        }

        // 加载侧边栏头像
        async function loadSidebarAvatar() {
            try {
                const user = Utils.getUser();
                if (!user) return;

                const response = await Utils.get(`/users/${user.id}/avatar`);
                const avatarPath = response.avatarPath;

                const sidebarAvatarImage = document.getElementById('sidebarAvatarImage');
                const sidebarAvatarIcon = document.getElementById('sidebarAvatarIcon');

                if (avatarPath) {
                    sidebarAvatarImage.src = avatarPath;
                    sidebarAvatarImage.style.display = 'block';
                    sidebarAvatarIcon.style.display = 'none';
                } else {
                    sidebarAvatarImage.style.display = 'none';
                    sidebarAvatarIcon.style.display = 'block';
                }
            } catch (error) {
                console.error('加载侧边栏头像失败:', error);
                // 保持默认头像显示
            }
        }

        // 设置导航菜单权限
        function setupNavigation() {
            const user = Utils.getUser();
            if (!user) return;

            // 更新用户信息显示
            document.getElementById('mobileUserName').textContent = user.fullName || user.username;
            document.getElementById('mobileUserRole').textContent = Utils.getAccountTypeText(user.accountType);

            // 隐藏没有权限的菜单
            // 只有工程师才能看到我的工单
            if (!Utils.hasAccountType('engineer')) {
                document.getElementById('myOrdersLink')?.remove();
            }
                if (!Utils.hasPermission('仓储管理')) {
                document.getElementById('materialRequestsLink')?.remove();
            }
            // 检查是否有系统管理权限
            if (Utils.hasPermission('用户管理') || Utils.hasPermission('地址管理')) {
                document.getElementById('adminLink').style.display = 'flex';
            }
        }

        // 侧边栏控制
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // 关闭侧边栏
        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        // 点击遮罩层关闭侧边栏
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('sidebarOverlay');
            overlay.addEventListener('click', closeSidebar);
            
            // 设置导航权限和加载未读消息
            setupNavigation();
        });

        // 退出登录
        function logout() {
            Utils.confirm('退出登录', '确定要退出登录吗？', async () => {
                Utils.removeToken();
                Utils.setUser(null);
                Utils.showSuccess('退出登录成功');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 1000);
            });
        }



        // 设置表单处理
        function setupFormHandlers() {
            // 密码修改表单提交
            document.getElementById('passwordForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                await changePassword();
            });

            // 密码强度检测
            document.getElementById('newPassword').addEventListener('input', checkPasswordStrength);
            
            // 确认密码验证
            document.getElementById('confirmPassword').addEventListener('input', validatePasswordMatch);
        }

        // 检查密码强度
        function checkPasswordStrength() {
            const password = document.getElementById('newPassword').value;
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            
            // 检查长度
            if (password.length >= 6) strength += 25;
            if (password.length >= 10) strength += 25;
            
            // 检查是否包含数字
            if (/\d/.test(password)) strength += 25;
            
            // 检查是否包含字母
            if (/[a-zA-Z]/.test(password)) strength += 25;
            
            // 更新强度显示
            strengthFill.style.width = strength + '%';
            
            if (strength <= 25) {
                strengthFill.className = 'strength-fill weak';
                strengthText.textContent = '弱';
                strengthText.style.color = '#e74c3c';
            } else if (strength <= 50) {
                strengthFill.className = 'strength-fill medium';
                strengthText.textContent = '中等';
                strengthText.style.color = '#f39c12';
            } else if (strength <= 75) {
                strengthFill.className = 'strength-fill strong';
                strengthText.textContent = '强';
                strengthText.style.color = '#27ae60';
            } else {
                strengthFill.className = 'strength-fill very-strong';
                strengthText.textContent = '很强';
                strengthText.style.color = '#2ecc71';
            }
        }

        // 验证密码匹配
        function validatePasswordMatch() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const confirmInput = document.getElementById('confirmPassword');
            
            if (confirmPassword && newPassword !== confirmPassword) {
                confirmInput.style.borderColor = '#e74c3c';
            } else {
                confirmInput.style.borderColor = '';
            }
        }

        // 修改密码
        async function changePassword() {
            try {
                const user = Utils.getUser();
                if (!user) return;

                const currentPassword = document.getElementById('currentPassword').value.trim();
                const newPassword = document.getElementById('newPassword').value.trim();
                const confirmPassword = document.getElementById('confirmPassword').value.trim();

                console.log('=== 移动端密码修改调试 ===');
                console.log('当前密码:', currentPassword);
                console.log('当前密码长度:', currentPassword.length);
                console.log('新密码:', newPassword);
                console.log('新密码长度:', newPassword.length);
                console.log('确认密码:', confirmPassword);
                console.log('确认密码长度:', confirmPassword.length);

                // 验证密码
                if (newPassword !== confirmPassword) {
                    Utils.showError('两次输入的新密码不一致');
                    return;
                }

                if (newPassword.length < 6) {
                    Utils.showError('密码长度不能少于6位');
                    return;
                }

                if (currentPassword === newPassword) {
                    Utils.showError('新密码不能与当前密码相同');
                    return;
                }

                // 显示加载状态
                const submitBtn = document.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 修改中...';
                submitBtn.disabled = true;

                await Utils.put(`/users/password/${user.id}`, {
                    currentPassword,
                    newPassword,
                    confirmPassword
                });

                // 密码修改成功后，自动退出登录
                Utils.showSuccess('密码修改成功，请重新登录');

                // 延迟1秒后退出登录并跳转到登录页
                setTimeout(() => {
                    logout();
                }, 1000);
            } catch (error) {
                console.error('修改密码失败:', error);
                Utils.showError(error.message || '修改密码失败');
            } finally {
                // 恢复按钮状态
                const submitBtn = document.querySelector('button[type="submit"]');
                submitBtn.innerHTML = '<i class="fas fa-save"></i> 修改密码';
                submitBtn.disabled = false;
            }
        }

        // 加载密码历史记录
        async function loadPasswordHistory() {
            try {
                const historyElement = document.getElementById('passwordHistory');
                
                // 模拟密码历史数据（实际应用中应从后端获取）
                const mockHistory = [
                    {
                        date: '2024-01-15 14:30:00',
                        action: '密码修改成功',
                        ip: '192.168.1.100',
                        device: 'Chrome/Windows'
                    },
                    {
                        date: '2023-12-20 09:15:00',
                        action: '密码重置',
                        ip: '192.168.1.101',
                        device: 'Safari/iOS'
                    }
                ];

                if (mockHistory.length > 0) {
                    let html = '<div class="password-timeline">';
                    mockHistory.forEach((record, index) => {
                        html += `
                            <div class="timeline-item">
                                <div class="timeline-dot ${index === 0 ? 'recent' : ''}"></div>
                                <div class="timeline-content">
                                    <div class="timeline-action">${record.action}</div>
                                    <div class="timeline-time">${record.date}</div>
                                    <div class="timeline-details">
                                        <span><i class="fas fa-globe"></i> ${record.ip}</span>
                                        <span><i class="fas fa-desktop"></i> ${record.device}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    historyElement.innerHTML = html;
                } else {
                    historyElement.innerHTML = '<div class="empty-state">暂无修改记录</div>';
                }
            } catch (error) {
                console.error('加载密码历史失败:', error);
                document.getElementById('passwordHistory').innerHTML = '<div class="empty-state">加载失败</div>';
            }
        }

        // 检查密码年龄
        function checkPasswordAge() {
            try {
                const user = Utils.getUser();
                if (!user || !user.lastPasswordChange) {
                    document.getElementById('passwordAgeStatus').className = 'status-icon warning';
                    document.getElementById('passwordAgeText').textContent = '未知';
                    return;
                }

                const lastChange = new Date(user.lastPasswordChange);
                const now = new Date();
                const daysDiff = Math.floor((now - lastChange) / (1000 * 60 * 60 * 24));
                
                const statusElement = document.getElementById('passwordAgeStatus');
                const textElement = document.getElementById('passwordAgeText');
                
                if (daysDiff <= 30) {
                    statusElement.className = 'status-icon success';
                    textElement.textContent = `最近 ${daysDiff} 天前更新`;
                } else if (daysDiff <= 90) {
                    statusElement.className = 'status-icon warning';
                    textElement.textContent = `${daysDiff} 天前更新（建议更新）`;
                } else {
                    statusElement.className = 'status-icon danger';
                    textElement.textContent = `${daysDiff} 天前更新（需要更新）`;
                }
            } catch (error) {
                console.error('检查密码年龄失败:', error);
                document.getElementById('passwordAgeStatus').className = 'status-icon warning';
                document.getElementById('passwordAgeText').textContent = '检查失败';
            }
        }

    </script>
</body>
</html>

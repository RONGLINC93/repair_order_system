<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>设置 - 移动端</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1">
    <link rel="stylesheet" href="/css/mobile-style.css">
    <link rel="stylesheet" href="/fontawesome-free-6.6.0-web/css/all.min.css">
    <style>
        /* 设置菜单列表样式 */
        .settings-menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .settings-menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .settings-menu-item:hover {
            background-color: #f5f5f5;
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background-color: #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .menu-item-icon.security {
            background-color: #e8e8e8;
            color: white;
        }

        .menu-item-icon.notification {
            background-color: #e8e8e8;
            color: white;
        }

        .menu-item-icon.about {
            background-color: #e8e8e8;
            color: white;
        }

        .menu-item-content {
            flex: 1;
        }

        .menu-item-title {
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin: 0 0 2px 0;
        }

        .menu-item-desc {
            font-size: 12px;
            color: #999;
            margin: 0;
        }

        .menu-item-right {
            color: #ccc;
            font-size: 14px;
        }

        /* 大屏幕适配：菜单列表多列显示 */
        @media (min-width: 768px) {
            .settings-menu-list {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 0 10px;
            }
        }

        @media (min-width: 1200px) {
            .settings-menu-list {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
        }

        @media (min-width: 1600px) {
            .settings-menu-list {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="mobile-header">
        <div class="header-left">
            <button class="menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
                <span class="unread-badge" id="menuChatBadge" style="display: none;"></span>
            </button>
            <button class="menu-btn" onclick="Utils.goBackWithRefresh()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1 class="app-title">设置</h1>
        </div>
        <div class="header-right">
            <div class="notification-icon" onclick="window.location.href='/mobile-notifications.html'">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" id="mobileNotificationBadge">0</span>
            </div>
        </div>
    </header>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="user-info">
                <div class="user-avatar" id="sidebarAvatar" onclick="window.location.href='/mobile-profile.html'">
                    <i class="fas fa-user" id="sidebarAvatarIcon"></i>
                    <img id="sidebarAvatarImage" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" alt="用户头像">
                </div>
                <div class="user-details">
                    <div class="user-name" id="mobileUserName">用户</div>
                    <div class="user-role" id="mobileUserRole">角色</div>
                </div>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="/mobile-index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>首页</span>
            </a>            
            <a href="/mobile-my-orders.html" class="nav-item" id="myOrdersLink">
                <i class="fas fa-tasks"></i>
                <span>我的工单</span>
            </a>
            <a href="/mobile-orders.html" class="nav-item">
                <i class="fas fa-list"></i>
                <span>所有工单</span>
            </a>
            <a href="/mobile-material-requests.html" class="nav-item" id="materialRequestsLink">
                <i class="fas fa-box"></i>
                <span>物料管理</span>
            </a>
            <a href="/mobile-chat.html" class="nav-item" id="chatLink">
                <i class="fas fa-comment"></i>
                <span>内部聊天</span>
                <span class="unread-badge" id="unreadChatCount" style="display: none;"></span>
            </a>
            
            
            <a href="/mobile-admin.html" class="nav-item" id="adminLink" style="display: none;">
                <i class="fas fa-cogs"></i>
                <span>系统管理</span>
            </a>
            <a href="/mobile-app-center.html" class="nav-item">
                <i class="fas fa-th"></i>
                <span>应用中心</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            
            <a href="/mobile-settings.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>设置</span>
            </a>
<a href="/mobile-about.html" class="nav-item" id="aboutLink">
                <i class="fas fa-info-circle"></i>
                <span>关于系统</span>
            </a>
            <a href="#" class="nav-item logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>退出登录</span>
            </a>
        </div>
    </aside>
    
    <!-- 侧边栏遮罩层 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 主内容区 -->
    <main class="main-content" style="margin-top: 60px;">
        <!-- 设置菜单列表 -->
        <section class="settings-menu-section">
            <div class="settings-menu-list">
                <!-- 个人信息 -->
                <div class="settings-menu-item" onclick="window.location.href='/mobile-profile.html'">
                    <div class="menu-item-left">
                        <div class="menu-item-icon">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="menu-item-content">
                            <h4 class="menu-item-title">个人信息</h4>
                            <p class="menu-item-desc">管理您的基本信息</p>
                        </div>
                    </div>
                    <div class="menu-item-right">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>

                <!-- 地址管理 -->
                <div class="settings-menu-item" onclick="window.location.href='/mobile-addresses.html'">
                    <div class="menu-item-left">
                        <div class="menu-item-icon">
                            <i class="fas fa-map-marker-alt"></i>
                        </div>
                        <div class="menu-item-content">
                            <h4 class="menu-item-title">地址管理</h4>
                            <p class="menu-item-desc">管理客户地址信息</p>
                        </div>
                    </div>
                    <div class="menu-item-right">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>


                <!-- 安全设置 -->
                <div class="settings-menu-item" onclick="window.location.href='/mobile-password-change.html'">
                    <div class="menu-item-left">
                        <div class="menu-item-icon security">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <div class="menu-item-content">
                            <h4 class="menu-item-title">安全设置</h4>
                            <p class="menu-item-desc">修改密码和安全选项</p>
                        </div>
                    </div>
                    <div class="menu-item-right">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>

                <!-- 通知设置 -->
                <div class="settings-menu-item" onclick="window.location.href='/mobile-notifications-settings.html'">
                    <div class="menu-item-left">
                        <div class="menu-item-icon notification">
                            <i class="fas fa-bell"></i>
                        </div>
                        <div class="menu-item-content">
                            <h4 class="menu-item-title">通知设置</h4>
                            <p class="menu-item-desc">管理通知偏好</p>
                        </div>
                    </div>
                    <div class="menu-item-right">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>

                <!-- 关于应用 -->
                <div class="settings-menu-item" onclick="window.location.href='/mobile-about.html'">
                    <div class="menu-item-left">
                        <div class="menu-item-icon about">
                            <i class="fas fa-info-circle"></i>
                        </div>
                        <div class="menu-item-content">
                            <h4 class="menu-item-title">关于应用</h4>
                            <p class="menu-item-desc">版本信息和使用条款</p>
                        </div>
                    </div>
                    <div class="menu-item-right">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            </div>
        </section>
        <!-- 遮罩层 -->
        <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>
    </main>

    <script src="/js/utils.js"></script>
    <script>
        let currentUser = null;

        // 页面初始化
        document.addEventListener('DOMContentLoaded', async function() {
            await checkAuth();
            setupNavigation();
            await loadUserProfile();
                        
            setupFormHandlers();
        });

        // 检查登录状态
        async function checkAuth() {
            const user = Utils.getUser();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            currentUser = user;
        }

        // 设置导航菜单权限
        function setupNavigation() {
            const user = Utils.getUser();
            if (!user) return;

            // 更新用户信息显示
            document.getElementById('mobileUserName').textContent = user.fullName || user.username;
            document.getElementById('mobileUserRole').textContent = Utils.getAccountTypeText(user.accountType);

            // 隐藏没有权限的菜单
            // 只有工程师才能看到我的工单
            if (!Utils.hasAccountType('engineer')) {
                document.getElementById('myOrdersLink')?.remove();
            }
                if (!Utils.hasPermission('仓储管理')) {
                document.getElementById('materialRequestsLink')?.remove();
            }
            // 检查是否有系统管理权限
            if (Utils.hasPermission('用户管理') || Utils.hasPermission('地址管理')) {
                document.getElementById('adminLink').style.display = 'flex';
            }
        }

        // 加载基本用户信息（设置页面只需要显示用户名和角色）
        async function loadUserProfile() {
            try {
                const user = Utils.getUser();
                if (!user) return;

                // 更新用户信息
                document.getElementById('mobileUserName').textContent = user.fullName || user.username;
                document.getElementById('mobileUserRole').textContent = Utils.getAccountTypeText(user.accountType);
                
                // 加载侧边栏头像
                await loadSidebarAvatar();
            } catch (error) {
                console.error('加载用户信息失败:', error);
                Utils.showError('加载用户信息失败');
            }
        }

        // 加载侧边栏头像
        async function loadSidebarAvatar() {
            try {
                const user = Utils.getUser();
                if (!user) return;

                const response = await Utils.get(`/users/${user.id}/avatar`);
                const avatarPath = response.avatarPath;

                const sidebarAvatarImage = document.getElementById('sidebarAvatarImage');
                const sidebarAvatarIcon = document.getElementById('sidebarAvatarIcon');

                if (avatarPath) {
                    sidebarAvatarImage.src = avatarPath;
                    sidebarAvatarImage.style.display = 'block';
                    sidebarAvatarIcon.style.display = 'none';
                } else {
                    sidebarAvatarImage.style.display = 'none';
                    sidebarAvatarIcon.style.display = 'block';
                }
            } catch (error) {
                console.error('加载侧边栏头像失败:', error);
                // 保持默认头像显示
            }
        }

        // 设置表单处理
        function setupFormHandlers() {
            // 无需处理密码修改表单，已移至独立页面
        }



        // 打开密码修改弹窗
        function openPasswordModal() {
            showModal('passwordModal');
        }





        // 显示弹窗
        function showModal(modalId) {
            document.getElementById(modalId).classList.add('show');
            document.getElementById('modalOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
            document.getElementById('modalOverlay').classList.remove('show');
            document.body.style.overflow = '';
        }

        // 关闭所有弹窗
        function closeAllModals() {
            const modals = document.querySelectorAll('.settings-modal');
            modals.forEach(modal => modal.classList.remove('show'));
            document.getElementById('modalOverlay').classList.remove('show');
            document.body.style.overflow = '';
        }





        // 修改密码
        async function changePassword() {
            try {
                const user = Utils.getUser();
                if (!user) return;

                const currentPassword = document.getElementById('currentPassword').value.trim();
                const newPassword = document.getElementById('newPassword').value.trim();
                const confirmPassword = document.getElementById('confirmPassword').value.trim();

                console.log('=== 移动端设置页面密码修改调试 ===');
                console.log('当前密码:', currentPassword);
                console.log('当前密码长度:', currentPassword.length);
                console.log('新密码:', newPassword);
                console.log('新密码长度:', newPassword.length);
                console.log('确认密码:', confirmPassword);
                console.log('确认密码长度:', confirmPassword.length);

                // 验证密码
                if (newPassword !== confirmPassword) {
                    Utils.showError('两次输入的新密码不一致');
                    return;
                }

                if (newPassword.length < 6) {
                    Utils.showError('密码长度不能少于6位');
                    return;
                }

                await Utils.put(`/users/password/${user.id}`, {
                    currentPassword,
                    newPassword,
                    confirmPassword
                });

                // 清空表单
                document.getElementById('passwordForm').reset();

                Utils.showSuccess('密码修改成功');
            } catch (error) {
                console.error('修改密码失败:', error);
                Utils.showError(error.message || '修改密码失败');
            }
        }

        // 侧边栏控制
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // 关闭侧边栏
        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
        
       
        // 点击遮罩层关闭侧边栏
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('sidebarOverlay');
            overlay.addEventListener('click', closeSidebar);
            
            // 设置导航权限和加载未读消息
            setupNavigation();
        });

        // 退出登录
        async function logout() {
            Utils.confirm('退出登录', '确定要退出登录吗？', async () => {
                try {
                    await Utils.post('/auth/logout');
                    Utils.removeToken();
                    Utils.setUser(null);
                    Utils.showSuccess('退出登录成功');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1000);
                } catch (error) {
                    console.error('退出登录失败:', error);
                    // 即使失败也清除本地数据
                    Utils.removeToken();
                    Utils.setUser(null);
                    window.location.href = '/login.html';
                }
            });
        }
    </script>
</body>
</html>

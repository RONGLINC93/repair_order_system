                        <div class="user-avatar" style="width: 30px; height: 30px; border-radius: 50%;">
                            ${(isSent ? currentUserAvatar : senderAvatar) !== '/images/default-avatar.png' ? 
                                `<img src="${isSent ? currentUserAvatar : senderAvatar}" alt="头像" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">` : 
                                '<i class="fas fa-user"></i>'}
                        </div>
                    </div>
                    <div class="message-body">
                        <div class="message-header">
                            <span class="sender-name">${isSent ? (currentUser.fullName || currentUser.username) : msg.sender_name}</span>
                            <span class="sender-account-type">${isSent ? getAccountTypeText(currentUser.accountType) : getAccountTypeText(msg.sender_account_type)}</span>
                        </div>
                        <div class="message-bubble">
                            ${msg.message_type === 'text' ? msg.content : 
                              msg.message_type === 'image' ? 
                              `<img src="${msg.file_url}" alt="图片" class="message-image" onclick="previewImage('${msg.file_url}')">` :
                              `<div class="message-file" onclick="downloadFile('${msg.file_url}', '${msg.content}')">
                                  <i class="fas fa-file"></i>
                                  <span>${msg.content}</span>
                              </div>`}
                            <div class="message-time">${time}</div>
                        </div>
                    </div>
                </div>
            `;
            
            // 添加到聊天框底部
            messagesContainer.insertAdjacentHTML('beforeend', messageHtml);
            
            // 滚动到底部
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 100);
            
            // 刷新未读消息数量
            if (typeof Utils.loadChatUnreadCount === 'function') {
                Utils.loadChatUnreadCount();
            }
        }

        // 获取最新的单条消息并添加到聊天框
        async function fetchLatestMessage() {
            try {
                // 请求最新的一条消息
                const response = await apiRequest(`/chat/messages/${currentChatUser.id}?page=1&limit=1`, 'GET');
                if (response.messages && response.messages.length > 0) {
                    const latestMessage = response.messages[0];
                    addNewMessageToChat(latestMessage);
                }
            } catch (error) {
                console.error('获取最新消息失败:', error);
                // 如果获取失败，回退到重新加载聊天记录
                loadChatMessages();
            }
        }

        function establishSSEConnection() {
            const userId = getCurrentUserId();
            if (!userId) return;

            try {
                sseConnection = new EventSource(`/api/notifications/stream?userId=${userId}`);
                
                sseConnection.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        
                        if (data.type === 'notification' && data.data.type === 'new_message') {
                            // 如果是当前聊天用户的消息，直接添加到聊天框且不显示通知
                            if (currentChatUser && data.data.senderId === currentChatUser.id) {
                                // 直接使用SSE推送的消息数据
                                const message = data.data.message;
                                if (message) {
                                    addNewMessageToChat(message);
                                } else {
                                    // 如果推送中没有完整的消息数据，则获取最新消息
                                    fetchLatestMessage();
                                }
                                // 对于当前聊天用户的消息，不播放提示音，不显示通知
                            } else {
                                // 否则更新用户列表、未读数并显示通知
                                loadUserList();       
                            }
                                        // 播放提示音
                                if (localStorage.getItem('notificationSoundEnabled') !== 'false') {
                                    playNotificationSound();
                                }
                        }             
                    } catch (error) {
                        console.error('SSE消息处理失败:', error);
                    }
                };

                sseConnection.onerror = function(event) {
                    console.error('SSE连接错误:', event);
                    // 5秒后重连
                    setTimeout(establishSSEConnection, 5000);
                };

            } catch (error) {
                console.error('建立SSE连接失败:', error);
            }
        }

        // 处理正在输入状态
        let typingTimeout;
        function handleTyping() {
            // 这里可以实现正在输入的提示功能
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                // 停止输入提示
            }, 1000);
        }

        // 辅助函数
        function getCurrentUserId() {
            const userInfo = Utils.getUser();
            return userInfo ? userInfo.id : null;
        }

        function getAccountTypeText(accountType) {
            const typeMap = {
                'admin': '管理员',
                'engineer': '工程师',
                'customer_service': '客服',
                'user': '用户'
            };
            return typeMap[accountType] || '用户';
        }

        function formatMessageTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const messageDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            
            if (messageDate.getTime() === today.getTime()) {
                return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else if (messageDate.getTime() === today.getTime() - 86400000) {
                return '昨天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' }) + 
                       ' ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
        }

        // 将文件大小转换为人类可读的格式
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showLoading(containerId) {
            document.getElementById(containerId).innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
            `;
        }

        function showLoadingMessage(message) {
            // 这个函数已废弃，改为在附件预览处显示上传状态
            console.log('文件上传中:', message);
        }

        function hideLoadingMessage() {
            // 这个函数已废弃，改为在附件预览处显示上传状态
        }

        function showError(message) {
            if (typeof Utils !== 'undefined' && Utils.showError) {
                Utils.showError(message);
            } else {
                alert(message); // 降级方案
            }
        }

        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // 播放通知声音
        function playNotificationSound() {
            try {
                const audio = new Audio('/sounds/notification.mp3');
                audio.volume = 0.3;
                audio.play().catch(err => console.log('播放声音失败:', err));
            } catch (error) {
                console.log('播放通知声音失败:', error);
            }
        }

        // 页面卸载时关闭SSE连接
        window.addEventListener('beforeunload', function() {
            if (sseConnection) {
                sseConnection.close();
            }
        });
        
        // 禁用浏览器下拉刷新和其他手势功能
        // 1. 监听touchstart记录初始位置
        let startY;
        
        // 2. 监听touchmove阻止默认行为
        document.addEventListener('touchmove', function(e) {
            // 仅允许特定元素（如聊天消息区域）的正常滚动
            const isInScrollableArea = e.target.closest('.chat-messages, .user-list');
            if (!isInScrollableArea) {
                // 对非滚动区域，阻止所有默认触摸行为
                e.preventDefault();
            } else {
                // 对滚动区域，仍然阻止可能触发刷新的顶部下拉
                const scrollable = isInScrollableArea;
                const scrollTop = scrollable.scrollTop;
                const currentY = e.touches[0].clientY;
                
                // 当在滚动区域顶部且向下拉动时，阻止默认行为
                if (scrollTop <= 0 && currentY > startY) {
                    e.preventDefault();
                }
            }
        }, { passive: false });
        
        // 3. 监听touchstart更新起始位置
        document.addEventListener('touchstart', function(e) {
            startY = e.touches[0].clientY;
        }, { passive: true });
        
        // 4. 禁用双指缩放
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        // 5. 添加额外的触摸事件监听器确保完全禁用浏览器手势
        document.addEventListener('touchstart', function(e) {
            // 记录起始位置用于判断方向
            startY = e.touches[0].clientY;
        }, { passive: true });
    </script>
</body>
</html>

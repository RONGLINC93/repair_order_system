<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 维修工单系统</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1">
    <link rel="stylesheet" href="/css/style.css">       
    <link rel="stylesheet" href="/fontawesome-free-6.6.0-web/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 500px; width: 100%;">
        <div class="card">
            <div class="card-header text-center" style="display: block; text-align: center;">
                <h2 class="card-title" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; text-shadow: 0 2px 4px rgba(102, 126, 234, 0.3); letter-spacing: -0.5px;">注册新账号</h2>
                <p class="text-muted" style="font-size: 0.95rem; color: #6c757d; margin-bottom: 0;">请填写以下信息完成注册</p>
            </div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="username" class="form-label">
                            <i class="fas fa-user"></i>
                            用户名 *
                        </label>
                        <div class="input-wrapper">
                            <div class="input-group">
                                <input type="text" id="username" name="username" class="form-control" required>
                                <button type="button" class="input-clear-btn" onclick="clearInput('username')" title="清除用户名">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock"></i>
                            密码 *
                        </label>
                        <div class="input-wrapper">
                            <div class="input-group">
                                <input type="password" id="password" name="password" class="form-control" required>
                                <button type="button" class="input-clear-btn" onclick="clearInput('password')" title="清除密码">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">
                            <i class="fas fa-lock"></i>
                            确认密码 *
                        </label>
                        <div class="input-wrapper">
                            <div class="input-group">
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                                <button type="button" class="input-clear-btn" onclick="clearInput('confirmPassword')" title="清除确认密码">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="fullName" class="form-label">
                            <i class="fas fa-id-card"></i>
                            姓名 *
                        </label>
                        <div class="input-wrapper">
                            <div class="input-group">
                                <input type="text" id="fullName" name="fullName" class="form-control" required>
                                <button type="button" class="input-clear-btn" onclick="clearInput('fullName')" title="清除姓名">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone" class="form-label">
                            <i class="fas fa-phone"></i>
                            手机号 *
                        </label>
                        <div class="input-wrapper">
                            <div class="input-group">
                                <input type="tel" id="phone" name="phone" class="form-control" required>
                                <button type="button" class="input-clear-btn" onclick="clearInput('phone')" title="清除手机号">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope"></i>
                            邮箱
                        </label>
                        <div class="input-wrapper">
                            <div class="input-group">
                                <input type="email" id="email" name="email" class="form-control">
                                <button type="button" class="input-clear-btn" onclick="clearInput('email')" title="清除邮箱">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="registerBtn" style="width: auto; padding: 0.75rem 3rem; margin: 0 auto; display: block;">
                        注册
                    </button>
                </form>
                
                <div class="mt-4 text-center">
                    <p>已有账号？ <a href="/login.html" class="text-primary">立即登录</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script>
        // 清除输入框内容
        function clearInput(inputId) {
            const input = document.getElementById(inputId);
            if (input) {
                input.value = '';
                input.focus();
                updateClearButton(inputId);
                
                // 清除验证状态
                input.classList.remove('is-invalid');
                
                // 触发input事件以更新其他可能的监听器
                input.dispatchEvent(new Event('input', { bubbles: true }));
                input.dispatchEvent(new Event('blur', { bubbles: true }));
                
                // 添加清除动画效果
                const inputGroup = input.closest('.input-group');
                if (inputGroup) {
                    inputGroup.classList.remove('has-value');
                }
            }
        }
        
        // 更新清除按钮显示状态
        function updateClearButton(inputId) {
            const input = document.getElementById(inputId);
            const inputGroup = input ? input.closest('.input-group') : null;
            
            if (inputGroup) {
                if (input.value.trim()) {
                    inputGroup.classList.add('has-value');
                } else {
                    inputGroup.classList.remove('has-value');
                }
            }
        }
        
        // 检查是否已登录
        document.addEventListener('DOMContentLoaded', function() {
            if (Utils.getToken()) {
                window.location.href = '/index.html';
            }
            
            // 添加输入事件监听器
            const inputs = ['username', 'password', 'confirmPassword', 'fullName', 'phone', 'email'];
            inputs.forEach(inputId => {
                const input = document.getElementById(inputId);
                if (input) {
                    // 输入时更新清除按钮状态
                    input.addEventListener('input', function() {
                        updateClearButton(inputId);
                    });
                    
                    // 初始化清除按钮状态
                    updateClearButton(inputId);
                }
            });
        });

        // 注册表单提交
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const registerBtn = document.getElementById('registerBtn');
            const originalText = registerBtn.textContent;
            
            try {
                // 禁用注册按钮
                registerBtn.disabled = true;
                registerBtn.textContent = '注册中...';
                
                // 表单验证
                const { isValid, errors } = Utils.validateForm(this);
                if (!isValid) {
                    Utils.showError(errors[0]);
                    return;
                }
                
                // 获取表单数据
                const formData = Utils.serializeForm(this);
                
                // 发送注册请求
                const response = await Utils.post('/auth/register', formData);
                
                Utils.showSuccess('注册成功！正在跳转到登录页面...');
                
                // 清除可能存在的记住密码数据，避免与旧凭据冲突
                Utils.clearRememberedCredentials();
                
                // 延迟跳转到登录页
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
                
            } catch (error) {
                console.error('注册失败:', error);
                Utils.showError(error.message || '注册失败，请稍后重试');
            } finally {
                // 恢复注册按钮
                registerBtn.disabled = false;
                registerBtn.textContent = originalText;
            }
        });

        // 实时验证密码确认
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (confirmPassword && password !== confirmPassword) {
                this.classList.add('is-invalid');
                // 可以添加提示信息
            } else {
                this.classList.remove('is-invalid');
            }
        });

        // 实时验证用户名
        document.getElementById('username').addEventListener('blur', async function() {
            const username = this.value.trim();
            if (username && username.length >= 3) {
                try {
                    // 这里可以添加用户名唯一性检查
                    // const response = await Utils.get(`/users/check-username?username=${username}`);
                } catch (error) {
                    console.error('检查用户名失败:', error);
                }
            }
        });
    </script>

    <style>
        /* 输入框清除按钮样式 */
        .form-group {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .form-label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            min-width: 100px;
            white-space: nowrap;
            justify-content: flex-start;
            gap: 6px;
        }
        
        .form-label i {
            color: #667eea;
            font-size: 14px;
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .input-wrapper {
            flex: 1;
            min-width: 0; /* 允许输入框在flex容器中正确收缩 */
        }
        
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        
        .input-group .form-control {
            width: 100%;
        }
        
        .input-group .form-control {
            padding-right: 40px;
        }
        
        .input-clear-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            border-radius: 50%;
            transition: all 0.2s ease;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }
        
        .input-clear-btn:hover {
            color: #667eea;
            background-color: rgba(102, 126, 234, 0.1);
            transform: scale(1.1);
        }
        
        .input-clear-btn:active {
            transform: scale(0.95);
        }
        
        /* 根据输入内容显示/隐藏清除按钮 */
        .input-group:not(.has-value) .input-clear-btn {
            opacity: 0;
            pointer-events: none;
        }
        
        .input-group.has-value .input-clear-btn {
            opacity: 1;
            pointer-events: auto;
        }
        
        .is-invalid {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
        }

        .form-group {
            position: relative;
        }

        .form-control.is-invalid + .invalid-feedback {
            display: block;
            color: #dc3545;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }
        
        /* 小屏强制并排布局 */
        @media (max-width: 600px) {
            .form-group {
                align-items: flex-start !important;
                gap: 10px !important;
                margin-bottom: 20px !important;
            }
            
            .form-label {
                min-width: 70px !important;
                font-size: 13px !important;
                flex-shrink: 0 !important; /* 防止标签收缩 */
                white-space: nowrap !important;
                align-self: center !important;
                gap: 4px !important;
            }
            
            .form-label i {
                font-size: 12px !important;
                width: 12px !important;
            }
            
            .input-wrapper {
                flex: 1 !important;
                min-width: 0 !important;
            }
            
            .input-clear-btn {
                right: 8px !important;
                width: 18px !important;
                height: 18px !important;
                font-size: 11px !important;
            }
            
            .input-group .form-control {
                padding-right: 30px !important;
                font-size: 14px !important;
            }
        }
        
        /* 超小屏优化 - 保持并排 */
        @media (max-width: 380px) {
            .form-group {
                gap: 8px !important;
                margin-bottom: 16px !important;
                align-items: flex-start !important;
            }
            
            .form-label {
                font-size: 12px !important;
                min-width: 65px !important;
                flex-shrink: 0 !important;
                white-space: nowrap !important;
                align-self: center !important;
                gap: 3px !important;
            }
            
            .form-label i {
                font-size: 11px !important;
                width: 10px !important;
            }
            
            .input-clear-btn {
                right: 6px !important;
                width: 16px !important;
                height: 16px !important;
                font-size: 10px !important;
            }
            
            .input-group .form-control {
                padding-right: 28px !important;
            }
        }
        
        /* 中等屏幕适配 */
        @media (min-width: 601px) and (max-width: 768px) {
            .form-group {
                gap: 12px;
            }
            
            .form-label {
                min-width: 80px;
                font-size: 13px;
                gap: 5px;
            }
            
            .form-label i {
                font-size: 13px;
                width: 14px;
            }
        }
        
        /* 大屏幕保持并排 */
        @media (min-width: 769px) {
            .form-group {
                align-items: center;
            }
            
            .form-label {
                min-width: 100px;
                font-size: 14px;
                gap: 6px;
            }
            
            .form-label i {
                font-size: 14px;
                width: 16px;
            }
        }
    </style>
</body>
</html>
